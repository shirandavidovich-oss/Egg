plugins {
    id "com.android.application"
}

android {
    namespace "com.shiran.egg"
    compileSdk 34

    defaultConfig {
        applicationId "com.shiran.egg"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "0.1"
    }

    // One fixed key, so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file("signing/egg-debug.ks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // direct phone-to-phone link
    implementation "com.google.android.gms:play-services-nearby:19.3.0"
    implementation "androidx.annotation:annotation:1.8.2"
}
