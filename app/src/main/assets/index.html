        P.eyes.lookX = -0.6; P.eyes.lookY = 0.3; P.eyes.lid = 0.5; P.mouth = { type: "wavy", w: 0.6 };
        P.armL = { a: 0.1, r: 1, bend: 0.25 }; P.armR = { ...P.armL };
        if (t > 7.2) P.over.push({ k: "sweat", age: t - 7.2 });
      }
      A.cue(3.5, () => sfx.hmph(1));
      A.cue(4.25, () => sfx.whoosh());
      A.cue(6.75, () => sfx.whoosh());
    } }
  };

  const TIERS = [["whistle", "tap", "stare"], ["yawn", "watch", "drum", "fly"], ["ballet", "snooze", "tantrum"]];
  const idle = { clock: 0, step: 0, anim: null, last: "", fadeOut: 0 };

  function noteActivity() {
    idle.clock = 0; idle.step = 0;
    if (idle.anim) stopIdle();
  }
  function stopIdle() {
    if (!idle.anim) return;
    idle.anim.stopVoices();
    idle.fadeOut = 0.15;
    idle.lastPose = idle.anim.pose;
    idle.anim = null;
  }
  function startIdle(tier) {
    const pool = (tier < 3 ? TIERS[tier] : TIERS.flat()).filter((n) => n !== idle.last);
    const id = pool[Math.floor(Math.random() * pool.length)];
    idle.last = id;
    const A = {
      id, t: 0, def: IDLE_ANIMS[id], fired: new Set(), voices: [], pose: null,
      cue(at, fn) { if (this.t >= at && !this.fired.has(at)) { this.fired.add(at); fn(); } },
      voice(v) { if (v) this.voices.push(v); },
      stopVoices() { for (const v of this.voices) { try { v.stop(); } catch (e) {} } this.voices = []; }
    };
    idle.anim = A;
  }
  function updateIdle(dt, calm) {
    if (idle.fadeOut > 0) idle.fadeOut = Math.max(0, idle.fadeOut - dt);
    if (idle.anim) {
      const A = idle.anim;
      A.t += dt;
      const P = basePose();
      A.def.f(A.t, P, A);
      A.pose = P;
      if (A.t >= A.def.dur) { idle.lastPose = P; idle.fadeOut = 0.12; idle.anim = null; }
      return;
    }
    if (!calm) { idle.clock = 0; idle.step = 0; return; }
    idle.clock += dt;
    const at = IDLE.after;
    const next = idle.step < at.length ? at[idle.step] : at[at.length - 1] + IDLE.thenEvery * (idle.step - at.length + 1);
    if (idle.clock >= next) { startIdle(Math.min(idle.step, 3)); idle.step++; }
  }

  // ---- drawing the jointed egg ----
  function drawRig(A, P, alpha) {
    const st = "crack" + (egg.stage + 1);
    const R = SPR.rig[st], PS = SPR.poses[st];
    const body = img[R.body];
    if (!body || !body.complete || !body.naturalWidth) return false;
    const s = A.eggH / PS.hgt * P.zoom;
    const [sx0, sy0, sx1, sy1] = R.shell;
    const cx = (sx0 + sx1) / 2, hipY = sy1 - 6;
    const W_ = sx1 - sx0, H_ = sy1 - sy0;
    const U2 = (u, v) => [sx0 + u * W_, sy0 + v * H_];            // shell-relative to drawing pixels
    const back = P.flip < 0;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(A.fx + P.x * A.eggH, A.fy + P.y * A.eggH);
    ctx.rotate(P.rot);
    ctx.scale(s, s);
    ctx.translate(-PS.ax, -PS.ay);

    // legs pivot at the hips
    for (const side of ["L", "R"]) {
      const lg = R["leg" + side], li = img[lg.img];
      if (!li || !li.complete) continue;
      ctx.save();
      ctx.translate(lg.hipX, lg.hipY);
      ctx.rotate(side === "L" ? P.legL : P.legR);
      ctx.drawImage(li, lg.x - lg.hipX, lg.y - lg.hipY, lg.w, lg.h);
      ctx.restore();
    }
    // the shell squashes and stretches from the hips; spinning narrows it
    ctx.translate(cx, hipY);
    ctx.scale(P.sx * Math.max(0.06, Math.abs(P.flip)) * (back ? -1 : 1), P.sy);
    ctx.translate(-cx, -hipY);
    const arms = () => { drawArm(R, U2, "L", P.armL, back); drawArm(R, U2, "R", P.armR, back); };
    if (P.armsBehind || back) arms();
    ctx.drawImage(body, 0, 0, PS.w, PS.h);
    if (!back && Math.abs(P.flip) > 0.25) drawFace(R, P);
    if (!(P.armsBehind || back)) arms();
    for (const o of P.over) drawOver(o, R, U2, P);
    ctx.restore();
    return true;
  }

  const INK = "#262629";
  function pencil(fn, w) {
    // a slightly doubled stroke, like the drawings
    ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.globalAlpha *= 1; fn(0); ctx.stroke();
    const a = ctx.globalAlpha; ctx.globalAlpha = a * 0.35; ctx.lineWidth = w * 0.6; fn(0.8); ctx.stroke(); ctx.globalAlpha = a;
  }

  function drawArm(R, U2, side, arm, back) {
    const sgn = side === "L" ? -1 : 1;
    const [shX, shY] = R["shoulder" + side];
    const len = R.armLen * 1.05;
    let hx, hy;
    if (arm.tx != null) {
      [hx, hy] = U2(arm.tx, arm.ty);
    } else {
      const a = arm.a;                                   // 0 = hanging, + = swung out and up
      hx = shX + Math.sin(a) * len * arm.r * sgn + sgn * 4;
      hy = shY + Math.cos(a) * len * arm.r;
    }
    const mx = (shX + hx) / 2, my = (shY + hy) / 2;
    const dx = hx - shX, dy = hy - shY, d = Math.hypot(dx, dy) || 1;
    const bend = (arm.bend || 0) * d * 0.45 * sgn;
    const cx = mx - dy / d * bend, cy = my + dx / d * bend;
    ctx.lineCap = "round";
    pencil((o) => { ctx.beginPath(); ctx.moveTo(shX + o, shY); ctx.quadraticCurveTo(cx + o, cy, hx + o, hy); }, 6.5);
    // glove, pointing along the end of the arm
    const G = SPR.rig["glove" + side], gi = img[G.img];
    if (!gi || !gi.complete) return;
    let ang = Math.atan2(hy - cy, hx - cx) - Math.PI / 2;
    if (arm.flatHand) ang = lerp(ang, sgn * -Math.PI / 2, arm.flatHand);
    if (arm.palmUp) ang = lerp(ang, Math.PI * sgn * 0.9, arm.palmUp);
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(ang);
    ctx.drawImage(gi, -G.wx, -G.wy, G.w, G.h);
    ctx.restore();
  }

  function drawFace(R, P) {
    const F = R.face, E = P.eyes;
    const box = (b) => ({ x: (b[0] + b[2]) / 2, y: (b[1] + b[3]) / 2, w: b[2] - b[0], h: b[3] - b[1] });
    const eL = box(F.eyeL), eR = box(F.eyeR), mo = box(F.mouth), bL = box(F.browL), bR = box(F.browR);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (const [e, side] of [[eL, -1], [eR, 1]]) {
      const rx = e.w * 0.4, ry = e.h * 0.42;
      if (E.shut) { drawShutEye(e, rx, ry, E.shut, side); continue; }
      const sc = E.small ? 1.08 : 1;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, rx * sc, ry * sc, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#fbfaf7"; ctx.fill();
      pencil((o) => { ctx.beginPath(); ctx.ellipse(e.x + o, e.y, rx * sc, ry * sc, 0, 0, Math.PI * 2); }, 2.2);
      let lx = E.lookX, ly = E.lookY;
      if (E.cross) lx = -side * 0.7;
      const pr = Math.min(rx, ry) * (E.small ? 0.3 : 0.55);
      const px = e.x + lx * (rx - pr) * 0.8, py = e.y + ly * (ry - pr) * 0.8;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fillStyle = "#1d1d20"; ctx.fill();
      ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.4, pr * 0.28, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
      // eyelid: covers the top of the eye, heavy line at its edge
      const lid = clamp(E.lid, 0, 1);
      if (lid > 0.02) {
        const ly2 = e.y - ry * sc + lid * 2 * ry * sc;
        ctx.save();
        ctx.beginPath(); ctx.ellipse(e.x, e.y, rx * sc + 1.5, ry * sc + 1.5, 0, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = "#f2f1ed"; ctx.fillRect(e.x - rx * 2, e.y - ry * 2, rx * 4, ly2 - (e.y - ry * 2));
        ctx.restore();
        pencil((o) => { ctx.beginPath(); ctx.moveTo(e.x - rx * 1.08, ly2 + 1 + o); ctx.quadraticCurveTo(e.x, ly2 - 3, e.x + rx * 1.08, ly2 + 1 + o); }, 4);
      }
    }
    // brows
    for (const [b, side, ang] of [[bL, -1, P.brows.l], [bR, 1, P.brows.r]]) {
      const y = b.y - P.brows.y * 14;
      ctx.save(); ctx.translate(b.x, y); ctx.rotate(ang * side * -1);
      pencil((o) => { ctx.beginPath(); ctx.moveTo(-b.w * 0.5, 2 + o); ctx.quadraticCurveTo(0, -4, b.w * 0.5, 2 + o); }, 4);
      ctx.restore();
    }
    drawMouth(mo, P.mouth);
  }

  function drawShutEye(e, rx, ry, kind, side) {
    if (kind === "sleep" || kind === "arc") {
      pencil((o) => { ctx.beginPath(); ctx.moveTo(e.x - rx, e.y + o); ctx.quadraticCurveTo(e.x, e.y + ry * 0.7, e.x + rx, e.y + o); }, 3.5);
    } else if (kind === "happy") {
      pencil((o) => { ctx.beginPath(); ctx.moveTo(e.x - rx, e.y + ry * 0.2 + o); ctx.quadraticCurveTo(e.x, e.y - ry * 0.8, e.x + rx, e.y + ry * 0.2 + o); }, 3.5);
    } else if (kind === "tight") {
      pencil((o) => { ctx.beginPath(); ctx.moveTo(e.x - rx * side * -1, e.y - ry * 0.5 + o); ctx.lineTo(e.x + rx * 0.6 * side * -1 * -1, e.y); ctx.lineTo(e.x - rx * side * -1, e.y + ry * 0.5 + o); }, 3.5);
    } else if (kind === "x") {
      pencil((o) => { ctx.beginPath(); ctx.moveTo(e.x - rx * 0.6, e.y - ry * 0.6 + o); ctx.lineTo(e.x + rx * 0.6, e.y + ry * 0.6); ctx.moveTo(e.x + rx * 0.6, e.y - ry * 0.6 + o); ctx.lineTo(e.x - rx * 0.6, e.y + ry * 0.6); }, 3.5);
    } else if (kind === "spiral") {
      pencil((o) => {
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const a = i / 40 * Math.PI * 5 + time * 6 * side, r = i / 40 * Math.min(rx, ry) * 0.95;
          const x = e.x + Math.cos(a) * r + o, y = e.y + Math.sin(a) * r;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
      }, 2.6);
    }
  }

  function drawMouth(m, M) {
    const w = m.w * 1.25 * (M.w || 1), x = m.x, y = m.y;
    const open = M.open || 0;
    if (M.type === "smile") pencil((o) => { ctx.beginPath(); ctx.moveTo(x - w / 2, y - 3 + o); ctx.quadraticCurveTo(x, y + 9, x + w / 2, y - 3 + o); }, 3.4);
    else if (M.type === "flat") pencil((o) => { ctx.beginPath(); ctx.moveTo(x - w / 2, y + o); ctx.lineTo(x + w / 2, y + o * 0.5); }, 3.4);
    else if (M.type === "pout") pencil((o) => { ctx.beginPath(); ctx.moveTo(x - w / 2, y + 4 + o); ctx.quadraticCurveTo(x, y - 6, x + w / 2, y + 4 + o); }, 3.4);
    else if (M.type === "wavy") pencil((o) => {
      ctx.beginPath();
      for (let i = 0; i <= 10; i++) { const px = x - w / 2 + w * i / 10, py = y + Math.sin(i * 1.9) * 2.5 + o; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    }, 3);
    else if (M.type === "o" || M.type === "yawn" || M.type === "shout" || M.type === "grimace" || M.type === "grin") {
      let rx, ry;
      if (M.type === "o") { rx = 4 + open * 10; ry = 5 + open * 13; }
      else if (M.type === "yawn") { rx = 8 + open * 14; ry = 8 + open * 30; }
      else if (M.type === "shout") { rx = 12 + open * 10; ry = 7 + open * 16; }
      else if (M.type === "grimace") { rx = 16; ry = 6 + open * 4; }
      else { rx = 15 + open * 4; ry = 4 + open * 9; }
      const yy = y + ry * 0.4;
      ctx.beginPath();
      if (M.type === "grin") { ctx.moveTo(x - rx, yy - ry * 0.4); ctx.quadraticCurveTo(x, yy + ry * 1.6, x + rx, yy - ry * 0.4); ctx.closePath(); }
      else if (M.type === "grimace") { ctx.rect(x - rx, yy - ry, rx * 2, ry * 2); }
      else ctx.ellipse(x, yy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#2b2a2e"; ctx.fill();
      if (M.type === "yawn" || M.type === "shout") { ctx.beginPath(); ctx.ellipse(x, yy + ry * 0.55, rx * 0.6, ry * 0.32, 0, 0, Math.PI * 2); ctx.fillStyle = "#77757a"; ctx.fill(); }
      if (M.type === "grimace" || M.type === "grin") {
        ctx.strokeStyle = "#f2f0ec"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - rx + 2, yy - (M.type === "grin" ? ry * 0.2 : 0)); ctx.lineTo(x + rx - 2, yy - (M.type === "grin" ? ry * 0.2 : 0)); ctx.stroke();
        if (M.type === "grimace") for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * rx / 3, yy - ry); ctx.lineTo(x + i * rx / 3, yy + ry); ctx.stroke(); }
      }
      pencil((o) => {
        ctx.beginPath();
        if (M.type === "grin") { ctx.moveTo(x - rx, yy - ry * 0.4 + o); ctx.quadraticCurveTo(x, yy + ry * 1.6, x + rx, yy - ry * 0.4 + o); ctx.closePath(); }
        else if (M.type === "grimace") ctx.rect(x - rx, yy - ry + o, rx * 2, ry * 2);
        else ctx.ellipse(x + o, yy, rx, ry, 0, 0, Math.PI * 2);
      }, 2.6);
    }
  }

  // little drawn extras around the egg, in drawing pixels
  function drawOver(o, R, U2, P) {
    const [sx0, sy0, sx1, sy1] = R.shell, W_ = sx1 - sx0, H_ = sy1 - sy0;
    const mo = R.face.mouth, mx = (mo[0] + mo[2]) / 2, my = (mo[1] + mo[3]) / 2;
    const a0 = ctx.globalAlpha;
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = "round";
    const text = (s, x, y, size, a = 1, rot = 0) => {
      ctx.save(); ctx.globalAlpha = a0 * a; ctx.translate(x, y); ctx.rotate(rot);
      ctx.font = `700 ${size}px Georgia, "Times New Roman", serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(s, 0, 0); ctx.restore();
    };
    switch (o.k) {
      case "note": {
        const a = 1 - o.age / 1.8; if (a <= 0) break;
        text(o.seed % 0.8 > 0.4 ? "♫" : "♪", mx + 40 + o.age * 70 + Math.sin(o.age * 5 + o.seed) * 10, my - 20 - o.age * 110, 46, a);
        break;
      }
      case "sour": {
        const a = 1 - o.age / 1.6; if (a <= 0) break;
        const x = mx + 70 + o.age * 30, y = my - 70 - o.age * 40;
        text("♪", x, y, 64, a, Math.sin(o.age * 30) * 0.3);
        ctx.save(); ctx.globalAlpha = a0 * a; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x + 25, y - 30); for (let i = 1; i < 6; i++) ctx.lineTo(x + 25 + i * 9, y - 30 + (i % 2 ? 12 : -6)); ctx.stroke(); ctx.restore();
        break;
      }
      case "sweat": {
        const a = Math.min(1, o.age * 4) * Math.max(0, 1 - (o.age - 0.8)); if (a <= 0) break;
        const x = sx1 - W_ * 0.08, y = sy0 + H_ * 0.3 + o.age * 30;
        ctx.save(); ctx.globalAlpha = a0 * a; ctx.beginPath();
        ctx.moveTo(x, y - 16); ctx.quadraticCurveTo(x + 11, y + 2, x, y + 8); ctx.quadraticCurveTo(x - 11, y + 2, x, y - 16);
        ctx.fillStyle = "#f6f6f8"; ctx.fill(); ctx.lineWidth = 2.4; ctx.stroke(); ctx.restore();
        break;
      }
      case "tick": break;
      case "dots": {
        for (let i = 0; i < 3; i++) if (o.age > i * 0.3) text("•", sx1 + 10 + i * 22, sy0 + H_ * 0.25, 30, Math.min(1, (o.age - i * 0.3) * 4));
        break;
      }
      case "question": {
        const a = Math.min(1, o.age * 4) * (1 - ss(2.0, 2.4, o.age));
        text("?", sx1 + 20, sy0 + H_ * 0.15 - Math.sin(o.age * 4) * 6, 64, a, Math.sin(o.age * 3) * 0.2);
        break;
      }
      case "hit": {
        const [hx, hy] = U2(o.side === "L" ? 0.3 : 0.7, 0.78);
        ctx.save(); ctx.globalAlpha = a0 * (1 - o.age / 0.2); ctx.lineWidth = 3;
        for (let i = 0; i < 4; i++) { const an = (o.side === "L" ? Math.PI : 0) + (i - 1.5) * 0.4; ctx.beginPath(); ctx.moveTo(hx + Math.cos(an) * 30, hy + Math.sin(an) * 30); ctx.lineTo(hx + Math.cos(an) * 48, hy + Math.sin(an) * 48); ctx.stroke(); }
        ctx.restore();
        break;
      }
      case "fly": {
        const [fx_, fy_] = U2(o.x, o.y);
        ctx.save();
        if (!o.landed) {
          ctx.globalAlpha = a0 * 0.35; ctx.setLineDash([4, 7]); ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i <= 12; i++) { const tt = o.age - i * 0.03; const [qx, qy] = U2(0.5 + Math.cos(tt * 3.1) * 0.55, 0.12 + Math.sin(tt * 6.2) * 0.12); i ? ctx.lineTo(qx, qy) : ctx.moveTo(qx, qy); }
          ctx.stroke(); ctx.setLineDash([]);
        }
        ctx.globalAlpha = a0;
        const wing = o.landed ? 0.3 : Math.abs(Math.sin(o.age * 60));
        ctx.fillStyle = "rgba(240,240,245,0.85)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(fx_ - 5, fy_ - 6, 7, 4 + wing * 3, -0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(fx_ + 5, fy_ - 6, 7, 4 + wing * 3, 0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(fx_, fy_, 6, 4.5, 0, 0, Math.PI * 2); ctx.fillStyle = INK; ctx.fill();
        ctx.restore();
        break;
      }
      case "impact": {
        const [x, y] = U2(o.x, o.y), r = 30 + o.age * 80;
        ctx.save(); ctx.globalAlpha = a0 * (1 - o.age / 0.35); ctx.lineWidth = 3.5;
        ctx.beginPath(); for (let i = 0; i < 16; i++) { const an = i / 16 * Math.PI * 2, rr = i % 2 ? r * 0.5 : r; i ? ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr * 0.6) : ctx.moveTo(x + rr, y); }
        ctx.closePath(); ctx.stroke(); ctx.restore();
        break;
      }
      case "stars": {
        const [x, y] = U2(o.x, o.y);
        ctx.save(); ctx.globalAlpha = a0 * Math.min(1, o.age * 3);
        for (let i = 0; i < 3; i++) {
          const an = time * 5 + i * Math.PI * 2 / 3;
          const px = x + Math.cos(an) * W_ * 0.32, py = y + Math.sin(an) * 18;
          ctx.save(); ctx.translate(px, py); ctx.scale(1 / 1, 1);
          ctx.fillStyle = ["#ffd23f", "#ff4fa3", "#3fc5ff"][i]; ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
          star(0, 0, 14, 5); ctx.fill(); ctx.stroke(); ctx.restore();
        }
        ctx.restore();
        break;
      }
      case "swirl": {
        ctx.save(); ctx.globalAlpha = a0 * 0.45 * Math.min(1, o.age * 2); ctx.lineWidth = 2.5;
        for (let i = 0; i < 3; i++) {
          const y = sy0 + H_ * (0.35 + i * 0.2), r = W_ * (0.62 + i * 0.05);
          const st0 = time * 9 + i;
          ctx.beginPath(); ctx.ellipse((sx0 + sx1) / 2, y, r, r * 0.16, 0, st0, st0 + 1.4 + o.speed * 1.5); ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case "dust": {
        const a = 1 - o.age / 0.7; if (a <= 0) break;
        ctx.save(); ctx.globalAlpha = a0 * a; ctx.lineWidth = 2;
        for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
          const x = (sx0 + sx1) / 2 + side * (W_ * 0.45 + o.age * 90 + i * 22), y = sy1 + 40 - i * 10 - o.age * 30;
          ctx.beginPath(); ctx.arc(x, y, 9 + i * 3 + o.age * 12, 0, Math.PI * 2); ctx.fillStyle = "rgba(235,234,230,0.9)"; ctx.fill(); ctx.stroke();
        }
        ctx.restore();
        break;
      }
      case "bubble": {
        const r = 6 + o.r * 26, x = mx + 24 + r * 0.7, y = my + 6;
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fill(); ctx.lineWidth = 2.2; ctx.stroke();
        ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.2, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
        ctx.restore();
        break;
      }
      case "zzz": {
        for (let i = 0; i < 3; i++) {
          const k = ((o.age * 0.5 + i / 3) % 1);
          text("z", sx1 - 10 + k * 70, sy0 + H_ * 0.25 - k * 120, 26 + k * 30, Math.sin(k * Math.PI), -0.2);
        }
        break;
      }
      case "pop": {
        const x = mx + 50, y = my + 6, r = 20 + o.age * 120;
        ctx.save(); ctx.globalAlpha = a0 * (1 - o.age / 0.25); ctx.lineWidth = 3;
        for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r * 0.6, y + Math.sin(an) * r * 0.6); ctx.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); ctx.stroke(); }
        ctx.restore();
        break;
      }
      case "bang": text("!", sx1 + 10, sy0 + H_ * 0.12, 80, Math.min(1, o.age * 6) * (1 - ss(0.8, 1.2, o.age)), 0.15); break;
      case "steam": {
        for (let i = 0; i < 4; i++) {
          const k = (o.age * 1.3 + i / 4) % 1, side = i % 2 ? 1 : -1;
          const x = (sx0 + sx1) / 2 + side * (20 + k * 50), y = sy0 - 10 - k * 90, r = 10 + k * 22;
          ctx.save(); ctx.globalAlpha = a0 * Math.sin(k * Math.PI) * 0.9; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.arc(x + r * 0.8, y + 4, r * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(240,240,242,0.9)"; ctx.fill(); ctx.stroke(); ctx.restore();
        }
        break;
      }
      case "huff": {
        const k = (o.age % 1.2) / 1.2;
        const x = (sx0 + sx1) / 2 + (P.flip < 0 ? -1 : 1) * (W_ * 0.55 + k * 40), y = sy0 + H_ * 0.45 - k * 20;
        ctx.save(); ctx.globalAlpha = a0 * Math.sin(k * Math.PI) * 0.8; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(x, y, 8 + k * 14, 0, Math.PI * 2); ctx.fillStyle = "rgba(240,240,242,0.9)"; ctx.fill(); ctx.stroke(); ctx.restore();
        break;
      }
    }
    ctx.globalAlpha = a0;
  }

  // ======================================================================
  //  ACCOUNT AND SERVER EGG
  //  The player gets a quiet account on first launch (no sign-up screen).
  //  The server rolls the egg once and always returns the same one.
  //  Later this account gets linked to the player's Google account.
  // ======================================================================
  const account = { token: null, until: 0, refresh: null, creature: null, busy: false, fails: 0, lastTry: -99 };
  try { account.refresh = localStorage.getItem("egg.refresh"); account.creature = localStorage.getItem("egg.serverCreature"); } catch (e) {}
  const inApp = !!native;

  async function api(path, body, token) {
    const r = await fetch(SERVER.url + path, {
      method: "POST",
      headers: { "apikey": SERVER.key, "Content-Type": "application/json", ...(token ? { "Authorization": "Bearer " + token } : {}) },
      body: JSON.stringify(body || {})
    });
    const text = await r.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
    if (!r.ok) throw new Error((data && (data.msg || data.message || data.error_description)) || ("HTTP " + r.status));
    return data;
  }
  function keepSession(d) {
    account.token = d.access_token;
    account.until = Date.now() + (d.expires_in || 3600) * 1000 - 60000;
    account.refresh = d.refresh_token;
    try { localStorage.setItem("egg.refresh", d.refresh_token); } catch (e) {}
  }
  async function session() {
    if (account.token && Date.now() < account.until) return account.token;
    if (account.refresh) {
      try { keepSession(await api("/auth/v1/token?grant_type=refresh_token", { refresh_token: account.refresh })); return account.token; }
      catch (e) { if (/invalid|not found|revoked/i.test(e.message)) { account.refresh = null; } else throw e; }
    }
    keepSession(await api("/auth/v1/signup", { data: {} }));        // a quiet, anonymous account
    return account.token;
  }
  async function claimEgg() {
    if (account.busy) return;
    account.busy = true; account.lastTry = time;
    try {
      const token = await session();
      const id = await api("/rest/v1/rpc/claim_egg", {}, token);
      if (typeof id === "string" && creatureMeta(id)) {
        account.creature = id; account.fails = 0;
        try { localStorage.setItem("egg.serverCreature", id); } catch (e) {}
      }
    } catch (e) {
      account.fails++;
      console.warn("egg server:", e.message);
    } finally { account.busy = false; }
  }
  function markHatched() { session().then((t) => api("/rest/v1/rpc/mark_hatched", {}, t)).catch(() => {}); }
  // the creature in this egg, once known: from the server, or (outside the app, when the server cannot be reached) a local roll
  function eggCreature() {
    if (!SERVER.enabled) return hatch.creature || rollCreature();
    if (account.creature) return account.creature;
    if (!account.busy && time - account.lastTry > 4) claimEgg();
    if (!inApp && account.fails >= 2) return hatch.creature || rollCreature();
    return null;
  }

  // ======================================================================
  //  HATCHING  (the shell gives way, balloons, and a creature in the nest)
  // ======================================================================
  const hatch = { t: 0, creature: null, shards: [], balloons: [], confetti: [], flash: 0, colorK: 0, bornAt: 0, hop: 0, readyT: 0, celebrate: null, cues: new Set() };
  const creatureMeta = (id) => SPR.creatures.find((c) => c.id === id) || SPR.legacyCreatures.find((c) => c.id === id);

  // pick a creature by rarity  (later this roll moves to the server, so it cannot be cheated)
  function rollCreature() {
    const pool = SPR.creatures.map((c) => ({ id: c.id, w: RARITY[c.rarity || "common"].weight }));
    const total = pool.reduce((s, c) => s + c.w, 0);
    let r = Math.random() * total;
    for (const c of pool) { r -= c.w; if (r <= 0) return c.id; }
    return pool[0].id;
  }
  function loadCreature(id) {
    if (!img["cr_" + id]) { load("cr_" + id, "creatures/" + id + ".webp"); load("crbw_" + id, "creatures/" + id + "_bw.webp"); }
  }
  function loadParty() {
    for (const b of SPR.balloons) if (!img[b.id]) load(b.id, "creatures/" + b.id + ".webp");
    if (!img.confetti_burst) load("confetti_burst", "creatures/confetti_burst.webp");
  }

  function startHatch() {
    loadCreature(hatch.creature);
    loadParty();
    egg.state = "hatching"; hatch.t = 0; hatch.cues.clear();
    stopIdle();
  }
  function hcue(at, fn) { if (hatch.t >= at && !hatch.cues.has(at)) { hatch.cues.add(at); fn(); } }

  function updateHatch(dt) {
    hatch.t += dt;
    const t = hatch.t, s = egg.screen;
    hcue(0.05, () => { audio.sample("08_comic_oh_no", 0.9); audio.duck(true); });
    hcue(0.8, () => { audio.sample("01_shell_first_crack", 1); chips(8); shakeScreen(0.3); buzz(30); });
    hcue(1.25, () => { audio.sample("02_rapid_cracks", 1); });
    for (const c of [1.3, 1.6, 1.85, 2.05, 2.2, 2.32]) hcue(c, () => { chips(6); shakeScreen(0.25); buzz(15); });
    hcue(2.5, () => {
      audio.sample("03_shell_explosion", 1); buzz(150); shakeScreen(1);
      hatch.flash = 1;
      // the shell bursts into big pieces
      for (let i = 0; i < 26; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.8, v = U * (0.6 + Math.random() * 1.1);
        hatch.shards.push({ x: s.cx + (Math.random() - 0.5) * s.rx, y: s.cy + (Math.random() - 0.5) * s.ry, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          r: U * (0.025 + Math.random() * 0.045), rot: Math.random() * 6, spin: (Math.random() - 0.5) * 14, sides: 4 + Math.floor(Math.random() * 3), t: 0 });
      }
      sparkle(s.cx, s.cy, 24);
    });
    hcue(2.9, () => { audio.sample("04_balloon_whoosh", 0.9); });
    hcue(3.0, () => { hatch.celebrate = audio.sample("05_happy_celebration_loop", 0.55, true); });
    // balloons drift up from below the screen
    if (t > 3.0 && t < 6.6) {
      const want = Math.floor((t - 3.0) / 3.6 * HATCH.balloons);
      while (hatch.balloons.length < want) {
        const b = SPR.balloons[Math.floor(Math.random() * SPR.balloons.length)];
        const sc = 0.7 + Math.random() * 0.7;
        hatch.balloons.push({ id: b.id, w: b.w, h: b.h, x: Math.random() * W, y: H + U * 0.3, vy: -U * (0.35 + Math.random() * 0.4), drift: (Math.random() - 0.5) * U * 0.15,
          ph: Math.random() * 6, s: sc * U * 0.22 / b.h * 1.6, t: 0 });
      }
    }
    hcue(4.6, () => { for (let i = 0; i < 3; i++) hatch.confetti.push({ x: W * (0.2 + Math.random() * 0.6), y: H * (0.25 + Math.random() * 0.3), t: 0, rot: Math.random() * 6 }); confettiRain(70); });
    hcue(6.5, () => { audio.sample("06_reveal_fanfare", 0.9); sparkle(s.cx, s.cy - s.ry * 0.2, 16); hatch.hop = 1; });
    hcue(7.0, () => { audio.sample("07_magic_sparkle", 0.7); });
    if (t > 12.5 && hatch.celebrate) { hatch.celebrate.stop(1.5); hatch.celebrate = null; audio.duck(false); }
    if (t > 9) {
      egg.state = "hatched"; hatch.bornAt = time;
      saveCreature();
      if (SERVER.enabled && account.creature) markHatched();
    }
  }

  function confettiRain(n) {
    const cols = ["#ff4fa3", "#ffd23f", "#3fc5ff", "#8b5cf6", "#5be37d", "#ff7a2f"];
    for (let i = 0; i < n; i++) fx.push({ kind: "conf", x: Math.random() * W, y: -U * 0.1 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * U * 0.2, vy: U * (0.25 + Math.random() * 0.35),
      t: 0, life: 4 + Math.random() * 2, r: U * (0.008 + Math.random() * 0.008), rot: Math.random() * 6, spin: (Math.random() - 0.5) * 10, col: cols[i % cols.length] });
  }

  function updateParty(dt) {
    for (let i = hatch.shards.length - 1; i >= 0; i--) {
      const p = hatch.shards[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 2.4 * dt; p.rot += p.spin * dt;
      if (p.y > H + U * 0.3) hatch.shards.splice(i, 1);
    }
    for (let i = hatch.balloons.length - 1; i >= 0; i--) {
      const b = hatch.balloons[i];
      b.t += dt; b.y += b.vy * dt; b.x += Math.sin(b.t * 1.3 + b.ph) * b.drift * dt;
      if (b.y < -U * 0.6) hatch.balloons.splice(i, 1);
    }
    for (let i = hatch.confetti.length - 1; i >= 0; i--) { hatch.confetti[i].t += dt; if (hatch.confetti[i].t > 1.4) hatch.confetti.splice(i, 1); }
    hatch.flash = Math.max(0, hatch.flash - dt / 0.7);
    hatch.hop = Math.max(0, hatch.hop - dt / 0.6);
    // the creature's color comes in later (for now: after a while; later: a game milestone)
    if (egg.state === "hatched" && time - hatch.bornAt > HATCH.colorAfter && hatch.colorK < 1) {
      if (hatch.colorK === 0) { audio.sample("07_magic_sparkle", 0.8); sparkle(egg.screen.cx, egg.screen.cy, 20); }
      hatch.colorK = Math.min(1, hatch.colorK + dt / 2.5);
    }
  }

  // the hatched creature belongs to the player's profile (with coins and learning kept apart)
  function saveCreature() {
    if (!EggProfile.active()) EggProfile.addCreature(hatch.creature, "hatch");
    window.dispatchEvent(new Event("egg:creature"));
  }

  // the egg during hatching: our cracked egg, shaking harder and glowing through the cracks
  function drawHatchingEgg(L) {
    const A = eggAnchor(L), t = hatch.t;
    if (t >= 2.5) return;
    const name = t < 0.8 ? "oh" : "crack5";
    const P = SPR.poses[name], im = img["p_" + name];
    if (!im || !im.complete) return;
    const amp = t < 0.8 ? 0.04 : 0.04 + (t - 0.8) / 1.7 * 0.14;
    const rot = Math.sin(t * (t < 0.8 ? 14 : 34)) * amp;
    const s = A.eggH / P.hgt * (1 + Math.max(0, t - 1.6) * 0.06);
    egg.screen = { cx: A.fx, cy: A.fy - A.eggH * 0.52, rx: A.eggH * 0.36, ry: A.eggH * 0.5 };
    // violet light pushing out
    const cy = A.fy - A.eggH * 0.5, r = A.eggH * (0.7 + t * 0.25 + Math.sin(t * 20) * 0.05);
    const g = ctx.createRadialGradient(A.fx, cy, 0, A.fx, cy, r);
    g.addColorStop(0, `rgba(237,228,255,${0.5 + t * 0.15})`); g.addColorStop(0.45, "rgba(167,139,250,0.4)"); g.addColorStop(1, "rgba(139,92,246,0)");
    ctx.fillStyle = g; ctx.fillRect(A.fx - r, cy - r, r * 2, r * 2);
    ctx.save();
    ctx.translate(A.fx, A.fy); ctx.rotate(rot); ctx.scale(s, s);
    ctx.drawImage(im, -P.ax, -P.ay, P.w, P.h);
    // light leaking through the cracks
    if (t > 0.8) {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.min(0.6, (t - 0.8) * 0.4) * (0.7 + Math.sin(t * 25) * 0.3);
      ctx.drawImage(im, -P.ax, -P.ay, P.w, P.h);
    }
    ctx.restore();
  }

  function drawCreature(L) {
    const id = hatch.creature; if (!id) return;
    const t = hatch.t, born = egg.state === "hatched" ? 1 : ss(6.4, 7.2, t);
    if (born <= 0) return;
    const C = creatureMeta(id), bw = img["crbw_" + id], col = img["cr_" + id];
    if (!bw || !bw.complete || !bw.naturalWidth) return;
    const A = eggAnchor(L);
    const hgt = A.eggH * HATCH.size * (0.3 + 0.7 * born);
    const s = hgt / C.h;
    const breathe = 1 + Math.sin(time * 2.2) * 0.02;
    const hop = Math.sin(hatch.hop * Math.PI) * A.eggH * 0.12 - tradeOffsetY(A);
    const sway = egg.side * 0.6 + Math.sin(time * 1.3) * 0.03;
    egg.screen = { cx: A.fx, cy: A.fy - hgt * 0.5, rx: C.w * s * 0.45, ry: hgt * 0.5 };
    ctx.save();
    ctx.globalAlpha = born;
    // shadow
    ctx.save(); ctx.translate(A.fx, A.fy); ctx.scale(1, 0.2);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, C.w * s * 0.45);
    g.addColorStop(0, "rgba(20,20,24,0.35)"); g.addColorStop(1, "rgba(20,20,24,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, C.w * s * 0.45, 0, 6.2832); ctx.fill(); ctx.restore();
    ctx.translate(A.fx, A.fy - hop);
    ctx.rotate(sway);
    ctx.scale(s * (2 - breathe), s * breathe);
    ctx.drawImage(bw, -C.w / 2, -C.h + C.h * 0.04, C.w, C.h);
    if (hatch.colorK > 0 && col && col.complete && col.naturalWidth) {
      ctx.globalAlpha = born * hatch.colorK;
      ctx.drawImage(col, -C.w / 2, -C.h + C.h * 0.04, C.w, C.h);
    }
    ctx.restore();
  }

  function drawParty() {
    for (const p of hatch.shards) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = "#f4f2ee"; ctx.strokeStyle = "#26262a"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < p.sides; i++) { const a = i / p.sides * Math.PI * 2, rr = p.r * (0.7 + ((i * 37) % 10) / 25); i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-p.r * 0.3, -p.r * 0.1); ctx.lineTo(p.r * 0.1, p.r * 0.2); ctx.stroke();
      ctx.restore();
    }
    for (const c of hatch.confetti) {
      const im = img.confetti_burst; if (!im || !im.complete || !im.naturalWidth) continue;
      const k = c.t / 1.4, sz = U * (0.3 + k * 0.5);
      ctx.save(); ctx.globalAlpha = 1 - k * k; ctx.translate(c.x, c.y); ctx.rotate(c.rot + k);
      ctx.drawImage(im, -sz / 2, -sz / 2, sz, sz); ctx.restore();
    }
    for (const b of hatch.balloons) {
      const im = img[b.id]; if (!im || !im.complete || !im.naturalWidth) continue;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(b.t * 1.7 + b.ph) * 0.08);
      ctx.drawImage(im, -b.w * b.s / 2, -b.h * b.s / 2, b.w * b.s, b.h * b.s); ctx.restore();
    }
    if (hatch.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${hatch.flash * 0.9})`; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(egg.screen.cx, egg.screen.cy, 0, egg.screen.cx, egg.screen.cy, U * 0.8);
      g.addColorStop(0, `rgba(237,228,255,${hatch.flash})`); g.addColorStop(1, "rgba(167,139,250,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  function tapCreature(x, y) {
    hatch.hop = 1;
    sparkle(x, y, 10);
    sfx.boing(0.6); sfx.sparkle(3);
    buzz(20);
  }

  // ======================================================================
  //  TRADING  (swipe up: the creature offers to swap with a phone nearby)
  //  The phones talk directly (Bluetooth / Wi-Fi), no server, no internet.
  //  Both players must say yes; then each creature leaves through the top
  //  of its screen and arrives on the other phone.
  // ======================================================================
  const trade = {
    stage: null,        // null | ask | looking | offer | waiting | declined | swapping
    t: 0, peer: null, myYes: false, peerYes: false, buttons: [], swapT: 0, incoming: null, fake: null
  };
  const link = {
    start(name) { try { native && native.tradeStart && native.tradeStart(name); } catch (e) {} },
    send(obj) { if (trade.fake) { trade.fake(obj); return; } try { native && native.tradeSend && native.tradeSend(JSON.stringify(obj)); } catch (e) {} },
    stop() { try { native && native.tradeStop && native.tradeStop(); } catch (e) {} }
  };
  function setTrade(stage) { trade.stage = stage; trade.t = 0; }
  function endTrade() { link.stop(); trade.stage = null; trade.peer = null; trade.myYes = trade.peerYes = false; trade.fake = null; }

  function openTrade() {
    if (trade.stage || egg.state !== "hatched") return;
    setTrade("ask");
    hatch.hop = 1; sfx.whoa(); buzz(15);
  }
  function startLooking() {
    setTrade("looking");
    // a random number in the name decides which phone calls the other
    link.start(hatch.creature + "|" + Math.random().toString(36).slice(2, 10));
  }
  // messages from the app's phone link
  window.eggTrade = (event, data) => {
    if (!trade.stage) return;
    if (event === "connected") {
      link.send({ t: "offer", c: hatch.creature });
    } else if (event === "message") {
      let m = null; try { m = JSON.parse(data); } catch (e) { return; }
      if (m.t === "offer" && creatureMeta(m.c)) {
        trade.peer = m.c; loadCreature(m.c);
        if (trade.stage === "looking") { setTrade("offer"); sfx.sparkle(4); buzz(20); }
      } else if (m.t === "yes") {
        trade.peerYes = true; maybeSwap();
      } else if (m.t === "no") {
        setTrade("declined"); sfx.hmph(0.6); link.stop();
      }
    } else if (event === "lost" && trade.stage !== "swapping") {
      setTrade("declined"); link.stop();
    } else if (event === "error" || event === "denied") {
      setTrade("declined");
    }
  };
  function maybeSwap() {
    if (trade.myYes && trade.peerYes && trade.peer && trade.stage !== "swapping") {
      trade.incoming = trade.peer;
      setTrade("swapping");
      sfx.whoosh(); buzz(60);
    }
  }
  function answer(yes) {
    if (trade.stage === "wall") { if (yes) { try { native.setWallpaper(); } catch (e) {} } endTrade(); return; }
    if (trade.stage === "ask") { if (yes) startLooking(); else endTrade(); return; }
    if (trade.stage === "looking" && !yes) { endTrade(); return; }
    if (trade.stage === "offer") {
      if (yes) { trade.myYes = true; link.send({ t: "yes" }); setTrade("waiting"); maybeSwap(); }
      else { link.send({ t: "no" }); setTimeout(endTrade, 300); trade.stage = null; }
    } else if (trade.stage === "waiting" && !yes) { link.send({ t: "no" }); setTimeout(endTrade, 300); trade.stage = null; }
  }

  function updateTrade(dt) {
    if (!trade.stage) return;
    trade.t += dt;
    if (trade.stage === "looking" && trade.t > TRADE.lookFor) { endTrade(); sfx.hmph(0.4); }
    if (trade.stage === "declined" && trade.t > 1.4) endTrade();
    if ((trade.stage === "ask" || trade.stage === "wall") && trade.t > 12) endTrade();
    if (trade.stage === "swapping") {
      trade.swapT = trade.t;
      if (trade.t > 0.9 && hatch.creature !== trade.incoming) {
        // our creature is gone through the top; the other one drops in
        hatch.creature = trade.incoming; hatch.colorK = 1; hatch.hop = 1;
        EggProfile.tradeActive(trade.incoming);          // the creature moves; coins and learning stay here
        window.dispatchEvent(new Event("egg:creature"));
        audio.sample("06_reveal_fanfare", 0.8);
      }
      if (trade.t > 2.2) { endTrade(); sparkle(egg.screen.cx, egg.screen.cy, 16); }
    }
  }
  // where the creature is during a swap: flies up and out, the new one falls in
  function tradeOffsetY(A) {
    if (trade.stage !== "swapping") return 0;
    const t = trade.t;
    if (t < 0.9) return -Math.pow(t / 0.9, 2) * (H + A.eggH);                   // up and away
    const k = Math.min(1, (t - 0.9) / 0.6);
    return -(1 - (k < 1 ? k * k : 1)) * (H + A.eggH) + (k >= 1 ? -Math.sin(Math.min(1, (t - 1.5) / 0.3) * Math.PI) * A.eggH * 0.08 : 0);
  }

  // ---- the thought bubble ----
  function drawTrade() {
    trade.buttons = [];
    if (!trade.stage || trade.stage === "swapping") return;
    const s = egg.screen;
    const bw = Math.min(W * 0.7, U * 0.72), bh = bw * 0.72;
    const bx = clamp(s.cx - bw / 2, 12, W - bw - 12), by = Math.max(H * 0.12, s.cy - s.ry - bh - U * 0.08);
    const pop = Math.min(1, trade.t / 0.25);
    const sc = trade.stage === "declined" ? 1 - Math.max(0, trade.t - 0.9) * 2 : 0.6 + 0.4 * (1 - Math.pow(1 - pop, 3));
    if (sc <= 0) return;
    ctx.save();

    ctx.fillStyle = "#fbfaf7"; ctx.strokeStyle = "#26262a"; ctx.lineWidth = 2.6;
    for (const [k, r] of [[0.25, 0.035], [0.12, 0.022]]) {

        const h = bh * 0.55, w = h * C.w / C.h;
        ctx.drawImage(im, cx - w / 2, by + bh * 0.08 + Math.sin(time * 3) * 3, w, h);
      }
      if (st === "waiting") for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.3 + 0.7 * Math.max(0, Math.sin(time * 5 - i)); ctx.beginPath(); ctx.arc(cx - 16 + i * 16, by + bh * 0.8, 4, 0, 6.2832); ctx.fillStyle = "#26262a"; ctx.fill(); ctx.globalAlpha = 1; }

      if (yes) { ctx.beginPath(); ctx.moveTo(x - r * 0.45, y); ctx.lineTo(x - r * 0.1, y + r * 0.38); ctx.lineTo(x + r * 0.5, y - r * 0.35); ctx.lineWidth = 4; ctx.stroke(); }
      else cross(x, y, r * 0.45);
      if (on) trade.buttons.push({ x, y, r: r * 1.3, yes });
    };
    const r = bh * 0.13, yb = by + bh * 0.8;
    if (st === "ask" || st === "offer" || st === "wall") { btn(cx - bw * 0.2, yb, r, true); btn(cx + bw * 0.2, yb, r, false); }
    if (st === "looking") btn(cx + bw * 0.32, yb, r * 0.8, false);

  }
  function swapIcon(x, y, r, spin) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(spin); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#7c3aed";

      ctx.beginPath(); ctx.moveTo(-r * 0.28, -r * 0.2); ctx.lineTo(0, 0); ctx.lineTo(-r * 0.28, r * 0.25); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }
  // a little phone with the egg on its screen: "put me on your home screen?"
  function phoneIcon(x, y, r) {
    ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = "#26262a"; ctx.fillStyle = "#ece9f6";
    ctx.beginPath(); roundRectPath(ctx, x - r * 0.62, y - r, r * 1.24, r * 2, r * 0.22); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r * 0.15, y - r * 0.85); ctx.lineTo(x + r * 0.15, y - r * 0.85); ctx.stroke();
    const bob = Math.sin(time * 3) * r * 0.05;
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.1 + bob, r * 0.3, r * 0.4, 0, 0, Math.PI * 2); ctx.fillStyle = "#fbfaf7"; ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#7c3aed"; ctx.lineWidth = 2.5;
    for (const [a, b] of [[-0.55, -0.55], [0.6, -0.4]]) { ctx.beginPath(); ctx.moveTo(x + r * a, y + r * b - r * 0.1); ctx.lineTo(x + r * a, y + r * b + r * 0.1); ctx.moveTo(x + r * a - r * 0.1, y + r * b); ctx.lineTo(x + r * a + r * 0.1, y + r * b); ctx.stroke(); }
    ctx.restore();
  }
  function cross(x, y, r) {
    ctx.save(); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#26262a";
    ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke(); ctx.restore();
  }
  function tradeTap(x, y) {
    for (const b of trade.buttons) if (Math.hypot(x - b.x, y - b.y) < b.r) { sfx.pop(); answer(b.yes); return true; }
    return !!trade.stage;     // while the bubble is open, other taps do nothing
  }

  // ======================================================================
  //  LIVE WALLPAPER  (tells the app which drawing to put on the home screen)
  // ======================================================================
  let syncN = 0, petSig = "";
  function syncPet() {
    if (!native || !native.setPet) return;
    let info;
    if (egg.state === "hatched" && hatch.creature) {
      info = { kind: "creature", img: "art/creatures/" + hatch.creature + "_bw.webp",
        color: hatch.colorK >= 1 ? "art/creatures/" + hatch.creature + ".webp" : "", ax: 0.5, ay: 0.96, hk: HATCH.size };
    } else {
      const P = SPR.poses["crack" + (egg.stage + 1)];
      info = { kind: "egg", img: "art/" + P.name + ".webp", color: "", ax: P.ax / P.w, ay: P.ay / P.h, hk: P.h / P.hgt };
    }
    const sig = JSON.stringify(info);
    if (sig !== petSig) { petSig = sig; try { native.setPet(sig); } catch (e) {} }
  }

  // ======================================================================
  //  THE DOG  (now and then a big friendly dog peeks in at the window)
  // ======================================================================
  const dog = { active: false, t: 0, kind: "bottom", side: 1, x: 0, next: DOG.firstAfter, leaving: 0, box: null };
  function updateDog(dt, canVisit) {
    if (!dog.active) {
      if (canVisit) dog.next -= dt;
      if (dog.next <= 0 && canVisit) {
        dog.active = true; dog.t = 0; dog.leaving = 0; dog.sniffed = dog.spoke = dog.panted = dog.talking = false;
        dog.kind = dog.forceKind || (Math.random() < 0.5 ? "bottom" : "side"); dog.forceKind = null;
        dog.side = dog.kind === "side" ? (Math.random() < 0.5 ? -1 : 1) : (Math.random() < 0.5 ? -1 : 1);
        dog.x = Math.random() < 0.5 ? 0.22 + Math.random() * 0.12 : 0.66 + Math.random() * 0.12;
        stopIdle();
        sfx.boof();
      }
      return;
    }
    dog.t += dt;
    if (dog.t > 0.9 && !dog.sniffed) { dog.sniffed = true; sfx.sniff(); }
    if (dog.t > 1.5 && !dog.spoke) {
      dog.spoke = true;
      if (egg.state !== "hatched" && egg.state !== "hatching") {
        dog.talking = true;
        let said = false;
        try { if (native && native.speak) { native.speak(DOG.line.replace(/!$/, ""), DOG.voice.pitch, DOG.voice.rate); said = true; } } catch (e) {}
        if (!said) { sfx.boof(); setTimeout(() => sfx.boof(), 220); }
        audio.duck(true); setTimeout(() => audio.duck(false), 2600);
      }
    }
    if (dog.t > 4.2 && !dog.panted) { dog.panted = true; sfx.pant(); }
    const stay = DOG.stay;
    if (!dog.leaving && dog.t > stay) dog.leaving = 0.0001;
    if (dog.leaving) {
      dog.leaving += dt / (dog.quick ? 0.25 : 0.7);
      if (dog.leaving >= 1) {
        dog.active = false; dog.quick = false;
        dog.next = DOG.every[0] + Math.random() * (DOG.every[1] - DOG.every[0]);
      }
    }
  }
  function dogShown() {
    if (!dog.active) return 0;
    const inK = 1 - Math.pow(1 - Math.min(1, dog.t / 0.8), 3) * 1;
    const enter = Math.min(1, dog.t / 0.8);
    const e = enter < 1 ? 1 + 2.2 * Math.pow(enter - 1, 3) + 1.2 * Math.pow(enter - 1, 2) : 1;   // eases in with a little overshoot
    return dog.leaving ? (1 - dog.leaving * dog.leaving) : e;
  }
  function drawDog() {
    if (!dog.active) return;
    const k = dogShown();
    const tilt = Math.sin(dog.t * 1.3) * 0.08 + (dog.t > 1.6 && dog.t < 2.4 ? Math.sin((dog.t - 1.6) / 0.8 * Math.PI) * 0.18 : 0);
    if (dog.kind === "bottom") {
      const im = img.dog_peek_bottom, D = SPR.dog.dogBottom;
      if (!im || !im.complete) return;
      const w = Math.min(W * 0.85, H * 0.5), h = w * D.h / D.w;
      const x = W * dog.x, y = H + h * (1 - k) ;
      ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * 0.5);
      ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore();
      dog.box = { x: x - w / 2, y: y - h, w, h };
    } else {
      const im = img.dog_peek_side, D = SPR.dog.dogSide;
      if (!im || !im.complete) return;
      const h = Math.min(H * 0.62, W * 1.3), w = h * D.w / D.h;
      const y = H * 0.18;
      const x = dog.side < 0 ? -w * (1 - k) : W + w * (1 - k);
      ctx.save(); ctx.translate(x, y + h * 0.3); ctx.rotate(tilt * (dog.side < 0 ? 1 : -1)); ctx.scale(dog.side < 0 ? 1 : -1, 1);
      ctx.drawImage(im, 0, -h * 0.3, w, h); ctx.restore();
      dog.box = dog.side < 0 ? { x, y, w, h } : { x: x - w, y, w, h };
    }
  }
  // the dog's speech bubble, comic style
  function drawDogLine() {
    if (!dog.active || !dog.talking || !dog.box) return;
    const k = dog.t - 1.5;
    if (k < 0 || k > 3.2 || dog.leaving) return;
    const a = Math.min(1, k * 6) * (1 - ss(2.8, 3.2, k));
    const pop = 0.7 + 0.3 * Math.min(1, k * 5);
    const fs = Math.round(U * 0.062);
    ctx.save();
    ctx.font = `800 ${fs}px "Varela Round", "Rubik", "Arial Hebrew", Arial, sans-serif`;
    ctx.direction = "rtl";
    const tw = ctx.measureText(DOG.line).width;
    const bw = tw + fs * 1.4, bh = fs * 2;
    const b = dog.box;
    // above the dog's head, leaning toward the middle of the screen
    let bx, by, tipX, tipY;
    if (dog.kind === "bottom") { bx = clamp(b.x + b.w * 0.5 - bw / 2, 10, W - bw - 10); by = b.y - bh - fs * 0.6; tipX = b.x + b.w * 0.5; tipY = b.y + fs * 0.3; }
    else { bx = dog.side < 0 ? clamp(b.x + b.w * 0.55, 10, W - bw - 10) : clamp(b.x + b.w * 0.45 - bw, 10, W - bw - 10); by = b.y - bh * 0.2; tipX = b.x + b.w * (dog.side < 0 ? 0.6 : 0.4); tipY = b.y + b.h * 0.22; }

    ctx.translate(bx + bw / 2, by + bh / 2); ctx.scale(pop, pop); ctx.translate(-(bx + bw / 2), -(by + bh / 2));

    ctx.beginPath(); roundRectPath(ctx, bx, by, bw, bh, bh * 0.45); ctx.fill(); ctx.stroke();
    // the tail pointing at the dog's mouth
    const mx = clamp(tipX, bx + bh * 0.6, bx + bw - bh * 0.6);
    ctx.beginPath(); ctx.moveTo(mx - fs * 0.35, by + bh - 1); ctx.lineTo(tipX, Math.max(by + bh + fs * 0.6, Math.min(tipY, by + bh + fs * 1.6))); ctx.lineTo(mx + fs * 0.35, by + bh - 1);
    ctx.fill(); ctx.stroke();
    ctx.fillRect(mx - fs * 0.33, by + bh - 4, fs * 0.66, 5);
    ctx.fillStyle = "#26262a"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const wob = Math.sin(k * 18) * (k < 0.6 ? 2 : 0);
    ctx.fillText(DOG.line, bx + bw / 2, by + bh / 2 + wob);
    ctx.restore();
  }
  function hitDog(x, y) {
    const b = dog.box;

  }

  // ======================================================================
  //  FRAME
  // ======================================================================
  let barAlpha = 0;
  function frame(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#ecebe8";
    ctx.fillRect(0, 0, W, H);
    if (screenShake > 0 && !reduceMotion) {
      const a = screenShake * U * 0.012;

      ctx.fillStyle = `rgba(26,18,44,${0.32 * Math.min(1, S)})`;

      else if (egg.state === "hatched") drawCreature(L);

      }

      ctx.drawImage(grainTex, 0, 0, W, H);
      drawMagicParticles(L, false);
      drawMagicFront(L);
    } else {
      ctx.drawImage(grainTex, 0, 0, W, H);
    }
    const v = ctx.createRadialGradient(W / 2, H * 0.45, U * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(20,20,24,0.22)");
    ctx.fillStyle = v; ctx.fillRect(-20, -20, W + 40, H + 40);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    barAlpha += ((arriving || egg.state === "hatching" || egg.state === "hatched" ? 0 : 1) - barAlpha) * (1 - Math.exp(-dt / 0.5));
    drawDog();
    drawDogLine();
    drawBar(barAlpha);
    drawParty();
    drawTrade();
    drawFx();
  }

  // ======================================================================
  //  LOOP
  // ======================================================================
  // for testing from a desktop browser's console: eggDebug.idle("yawn"), eggDebug.dog("side")
  window.eggDebug = {
    idle(id) { if (!IDLE_ANIMS[id]) return Object.keys(IDLE_ANIMS); stopIdle(); idle.fadeOut = 0; startIdle(0); idle.anim.id = id; idle.anim.def = IDLE_ANIMS[id]; idle.last = id; },
    dog(kind) { dog.next = 0; dog.forceKind = kind; },
    tradeWith(id) {
      openTrade();
      trade.fake = (m) => {
        if (m.t === "offer") return;
        if (m.t === "yes") setTimeout(() => window.eggTrade("message", JSON.stringify({ t: "yes" })), 700);
      };
      const orig = startLooking;
      setTimeout(() => { if (trade.stage === "ask") answer(true); setTimeout(() => { window.eggTrade("connected"); window.eggTrade("message", JSON.stringify({ t: "offer", c: id || "pompom" })); }, 1200); }, 800);
    },
    hatch(id) { if (id) hatch.creature = id; egg.shell = 0; egg.shownShell = 0; hatch.readyT = 0; }

  const mine = EggProfile.active();
  const savedCreature = mine && creatureMeta(mine.species) ? mine.species : null;

    hatch.creature = savedCreature; hatch.colorK = 1; egg.state = "hatched"; loadCreature(savedCreature);
  } else if (MAGIC.enabled && (DEV.replayMagic || !arrivedBefore)) {

  window.__egg = {
    covered: false,                                    // a full-screen page is over the game: rest
    hatched: () => egg.state === "hatched",
    species: () => hatch.creature,
    meta: creatureMeta,
    setCreature(species) { hatch.creature = species; hatch.colorK = 1; hatch.hop = 1; loadCreature(species); petSig = ""; },
    openTrade() { if (egg.state === "hatched") openTrade(); },
    closeBubble() { if (trade.stage && trade.stage !== "swapping") { if (trade.stage === "offer" || trade.stage === "waiting") link.send({ t: "no" }); endTrade(); return true; } return false; },
    sfx, audio, buzz,
    newEgg() { EggProfile.devNewEgg(); try { location.reload(); } catch (e) {} }
  };

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (window.__egg.covered) { requestAnimationFrame(loop); return; }
    // hold the arrival until the drawings are in, so the magic is not missed
    if (pending === 0 || egg.state !== "arriving") update(dt);
    frame(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

(() => {

  // ---------------- content ----------------

  const SPRING_UNITS = [

    { id: "springs.wall", he: "קפיץ על רצפה עם חיכוך", insight: "על רצפה עם חיכוך כל תנודה קטנה יותר, והדמות נעצרת איפה שהקפיץ כבר לא מנצח את החיכוך הסטטי.", eq: "נעצר כש-k·|x| ≤ μs·m·g" },
    { id: "springs.launch", he: "קפיץ משגר: אנרגיה לגובה", insight: "האנרגיה שנאגרה בדחיסה, ½kx², הופכת לגובה. הגוף עף רק אם דוחסים יותר מ-2mg/k, והקפיץ מפסיק לדחוף ברגע שהוא חוזר לאורך הטבעי.", eq: "½·k·x² = m·g·h" },

  }
  // a body looks heavier when the experiment mass is higher (drawing only)
  const fatness = (m, m0) => clamp(Math.pow(m / m0, 0.4), 0.74, 1.42);
  const FEEL = (r) => r > 1.3 ? "אוי… אני כבד מאוד. מה שמתם לי באוכל?" : r > 1.1 ? "אממ, אני מרגיש קצת כבד." : r < 0.7 ? "אני קליל מדי… זה מפחיד." : r < 0.9 ? "קצת קל לי. מוזר." : "זה כמעט אני.";
  // the creature does not like a borrowed mass: after a try (or a while) it goes back to its own
  function massKeeper(ui_) {
    let lastInput = 0, seenAt = 0, from = null, t0 = 0;
    return {
      touched() { lastInput = performance.now(); seenAt = 0; from = null; },
      seen() { if (lab.massOverride !== null && !seenAt) seenAt = performance.now(); },
      tick(idle) {
        if (lab.massOverride === null) { from = null; return; }
        const now = performance.now();
        if (from === null) {
          if ((seenAt && now - seenAt > 2500) || (idle && lastInput && now - lastInput > 8000)) { from = lab.massOverride; t0 = now; ui_.say("אוף. תחזירו לי את הגוף שלי…", 1.8); G.sfx.phew && G.sfx.phew(); }
          return;
        }
        const k = Math.min(1, (now - t0) / 1600), e = 1 - Math.pow(1 - k, 3), m = from + (ui_.m0() - from) * e;
        if (k >= 1) { lab.massOverride = null; from = null; seenAt = 0; lastInput = 0; ui_.apply(ui_.m0()); ui_.say("פפפ… חזרתי לעצמי. אל תעשו לי את זה שוב!", 2.6); G.sfx.boing(0.4); }
        else { lab.massOverride = m; ui_.apply(m); }
      }
    };
  }

  // ======================================================================
  //  FORCE ARROWS: bold, haloed, with the name and the size in a coloured tag
  // ======================================================================
  function forceArrow(ctx, x0, y0, vx, vy, color, label, opts = {}) {
    let len = Math.hypot(vx, vy); if (len < 1.5) return;
    const ux = vx / len, uy = vy / len;
    len = Math.max(len, 30);                              // a small force is still visible
    const x1 = x0 + ux * len, y1 = y0 + uy * len, head = opts.thin ? 13 : 19, half = opts.thin ? 7 : 10.5, lw = opts.thin ? 3 : 6;
    ctx.save(); ctx.globalAlpha = opts.alpha ?? 1; ctx.lineCap = "round"; ctx.lineJoin = "round";
    const shaft = () => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * head * 0.8, y1 - uy * head * 0.8); };
    const tip = () => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * head - uy * half, y1 - uy * head + ux * half); ctx.lineTo(x1 - ux * head + uy * half, y1 - uy * head - ux * half); ctx.closePath(); };
    if (opts.dash) ctx.setLineDash([9, 7]);
    ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = lw + 5; shaft(); ctx.stroke();   // halo so it reads over the drawing
    ctx.setLineDash([]); ctx.lineWidth = 5; tip(); ctx.stroke();
    if (opts.dash) ctx.setLineDash([9, 7]);
    ctx.strokeStyle = color; ctx.lineWidth = lw; shaft(); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; tip(); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x0, y0, opts.thin ? 3 : 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x0, y0, opts.thin ? 2 : 3.2, 0, Math.PI * 2); ctx.fill();
    if (label) {
      const text = opts.value !== undefined ? `${label}  ${fmt(opts.value, 1)} N` : label;
      ctx.font = "700 13px " + FONT; ctx.direction = "ltr"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const tw = ctx.measureText(text).width + 14, th = 22, side = opts.side || 0;
      let lx = x1 + ux * (tw / 2 + 8) + side * uy * 16 + (opts.dx || 0), ly = y1 + uy * (th / 2 + 8) - side * ux * 16 + (opts.dy || 0);
      const cw = ctx.canvas.width / (ctx.getTransform().a || 1), chh = ctx.canvas.height / (ctx.getTransform().d || 1);
      lx = clamp(lx, tw / 2 + 4, cw - tw / 2 - 4); ly = clamp(ly, th / 2 + 4, chh - th / 2 - 4);
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx - tw / 2, ly - th / 2, tw, th, 11) : ctx.rect(lx - tw / 2, ly - th / 2, tw, th); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.fillText(text, lx, ly + 0.5);
    }
    ctx.restore();
  }

  // ======================================================================
  //  THE SPRING LAB
  // ======================================================================
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const L0 = 0.30;                      // natural length of the spring (m)
  const U_MAX = 0.25;                   // how far below equilibrium it can be pulled (m)
  const lab = { k: 120, massOverride: null, b: 0, lastU0: 0.12, mode: "hang", surface: "dry_wood" };

  SCREENS.lab = (args = {}) => {
    if (lab.mode === "wall") return SCREENS.wall(args);
    if (lab.mode === "launch") return SCREENS.launch(args);
    if (lab.mode === "graph") return SCREENS.graph(args);
    if (lab.mode === "pair") return SCREENS.pair(args);
    if (lab.mode === "osc") return SCREENS.osc(args);
    if (lab.mode === "ramp") return SCREENS.ramp(args);
    if (lab.mode === "islope") return SCREENS.islope(args);
    if (lab.mode === "two") return SCREENS.two(args);
    if (lab.mode === "pulley") return SCREENS.pulley(args);
    lab.mode = "hang";
    setTitle("קפיץ־קפוץ", "קפיץ תלוי מהתקרה");
    let sp = activeSpecies();
    const m0 = () => phys(sp).mass_kg;
    const mass = () => lab.massOverride ?? m0();
    screenEl.innerHTML = `
      <div class="lab-screen">
        ${modeSeg("hang")}
        <div class="lab" id="lab">
          <canvas id="labCanvas"></canvas>
          <div class="bubble say" id="say" hidden></div>
          <div class="lab-tools">
            <button class="chip" id="charChip" type="button"></button>
            <button class="chip" id="formulaBtn" type="button">הצג נוסחה</button>
          </div>
        </div>
        <div class="readouts">
          <button type="button" class="readout" data-info="s"><small>התארכות <i class="qi">?</i></small><b id="rS">–</b></button>
          <button type="button" class="readout" data-info="F"><small>כוח קפיץ <i class="qi">?</i></small><b id="rF">–</b></button>
          <button type="button" class="readout" data-info="E"><small>אנרגיה <i class="qi">?</i></small><b id="rE">–</b></button>
          <button type="button" class="readout" data-info="T"><small>זמן מחזור <i class="qi">?</i></small><b id="rT">–</b></button>
        </div>
        <div class="card controls">
          <div class="slider-row"><label for="kIn"><span>קשיחות הקפיץ k ${infoBtn("k")}</span><span class="val" id="kVal"></span></label>
            <input id="kIn" type="range" min="30" max="400" step="5"></div>
          <div class="slider-row"><label for="mIn"><span>מסה m ${infoBtn("m")} <span class="note" id="mNote"></span></span><span class="val" id="mVal"></span></label>
            <input id="mIn" class="mass" type="range" min="0.5" max="4" step="0.1">
            <button class="linkish" id="mReset" type="button" hidden>חזרה למסת הדמות</button></div>
          <details class="adv" id="adv"><summary>מתקדם: בלימה b</summary>
            <div class="slider-row"><label for="bIn"><span>מקדם בלימה b ${infoBtn("b")}</span><span class="val" id="bVal"></span></label>
              <input id="bIn" class="damp" type="range" min="0" max="3" step="0.1"></div>
            <p class="fine">עם בלימה התנודה דועכת, וזמן המחזור כבר לא בדיוק 2π√(m/k).</p>
          </details>
        </div>
        <div class="card formula" id="formula" hidden></div>
      </div>`;

    const cv = $("#labCanvas"), ctx = cv.getContext("2d"), box = $("#lab");
    let W = 0, H = 0, DPR = 1;
    const resize = () => { const r = box.getBoundingClientRect(); DPR = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(box);

    const img = new Image(); let imgSp = null;
    const loadImg = () => { if (imgSp !== sp) { imgSp = sp; img.src = artOf(sp); } };
    loadImg();

    const params = () => SP.params(mass(), lab.k, lab.b);
    const sim = new SP.Sim(params(), 0);
    let scale = 300, formulaOpen = false, dragging = null, everDragged = false, sayT = 0, raf = 0, lastT = performance.now();
    const releases = [];                                     // what the player has tried this visit
    let trial = null, questionCooldown = 1;

    // ---- controls ----
    const kIn = $("#kIn"), mIn = $("#mIn"), bIn = $("#bIn");
    kIn.value = lab.k; mIn.value = mass(); bIn.value = lab.b;
    function paintControls() {
      $("#kVal").textContent = lab.k + " N/m";
      $("#mVal").textContent = fmt(mass(), 1) + " kg";
      $("#bVal").textContent = fmt(lab.b, 1) + " N·s/m";
      const own = lab.massOverride === null;
      $("#mNote").textContent = own ? "(מסת " + nameOf(sp) + ")" : "(מסה בניסוי)";
      $("#mReset").hidden = own;
      $("#charChip").innerHTML = `<img src="${artOf(sp)}" alt=""><span>${esc(nameOf(sp))} · <span class="ltr">${fmt(m0(), 1)} kg</span></span><span aria-hidden="true">⇄</span>`;
    }
    // any change: start again at rest at the NEW equilibrium, and say what moved
    function reconfigure(why) {
      const before = { eq: SP.equilibrium(sim.p), T: SP.period(sim.p) };
      sim.reset(params(), 0);
      trial = null;
      const after = { eq: SP.equilibrium(sim.p), T: SP.period(sim.p) };
      if (why) say(`${why} שיווי המשקל: ${fmt(before.eq * 100, 1)} ← ${fmt(after.eq * 100, 1)} ס״מ. T: ${fmt(before.T)} ← ${fmt(after.T)} שנ׳.`, 4);
      paintControls(); paintFormula();
    }
    kIn.addEventListener("input", () => { lab.k = +kIn.value; reconfigure(); });
    kIn.addEventListener("change", () => reconfigure("הקפיץ הוחלף."));
    mIn.addEventListener("input", () => { keeper.touched(); lab.massOverride = Math.abs(+mIn.value - m0()) < 0.05 ? null : +mIn.value; reconfigure(); });
    mIn.addEventListener("change", () => {
      reconfigure();
      if (lab.massOverride !== null) say(`${FEEL(mass() / m0())} שיווי המשקל עכשיו ${fmt(SP.equilibrium(sim.p) * 100, 1)} ס״מ, T = ${fmt(SP.period(sim.p))} שנ׳. מהר, נסו לפני שאני חוזר לעצמי!`, 4);
    });
    bIn.addEventListener("input", () => { lab.b = +bIn.value; reconfigure(); });
    $("#mReset").addEventListener("click", () => { lab.massOverride = null; mIn.value = m0(); reconfigure("חזרה למסת הדמות."); });
    $("#formulaBtn").addEventListener("click", () => {
      formulaOpen = !$("#formula").hidden ? false : true;
      $("#formula").hidden = !formulaOpen;
      $("#formulaBtn").textContent = formulaOpen ? "הסתר נוסחה" : "הצג נוסחה";
      if (formulaOpen) { P.data.physics.formulaSeen = true; P.save(); paintFormula(); $("#formula").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
    });
    function paintFormula() {
      if ($("#formula").hidden) return;
      const p = sim.p, s = sim.st.s, eq = SP.equilibrium(p);
      setFormula($("#formula"), `
        <div class="eq"><span>כוח הקפיץ (חוק הוק)</span><span class="m">F = −k·s<em>${fmt(-p.k * s, 1)} N</em></span></div>
        <div class="eq"><span>אנרגיה אלסטית</span><span class="m">E = ½·k·s²<em>${fmt(SP.elasticEnergy(s, p.k), 2)} J</em></span></div>
        <div class="eq"><span>שיווי משקל</span><span class="m">s<sub>eq</sub> = m·g / k<em>${fmt(eq * 100, 1)} cm</em></span></div>
        <div class="eq"><span>זמן מחזור (בלי בלימה)</span><span class="m">T = 2π·√(m/k)<em>${fmt(SP.period(p))} s</em></span></div>
        <p class="fine">s היא ההתארכות מהאורך הטבעי של הקפיץ. כוח חיובי פירושו כלפי מטה, ולכן כשהקפיץ מתוח F שלילי: הוא מושך למעלה.</p>`);
    }
    paintControls();
    const keeper = massKeeper({ say: (t, d) => say(t, d), m0, apply: (m) => { mIn.value = m; sim.reset(params(), 0); trial = null; paintControls(); } });
    infoLive = () => ({ k: lab.k, m: mass(), m0: m0(), name: nameOf(sp), s: sim.st.s, eq: SP.equilibrium(sim.p) });

    // ---- switching creature: same k, same pull below equilibrium, a fair comparison ----
    $("#charChip").addEventListener("click", () => pickOwned(sp, "להחליף דמות בניסוי", (newSp) => {
      const oldName = nameOf(sp), oldT = SP.period(sim.p);
      sp = newSp; lab.massOverride = null; mIn.value = m0(); loadImg();
      const u0 = Math.max(0.05, lab.lastU0);
      sim.reset(params(), u0); sim.release();
      trial = startRelease(u0);
      paintControls(); paintFormula();
      say(`עם ${nameOf(sp)} המסה אחרת, אז זמן המחזור משתנה: ${fmt(oldT)} ← ${fmt(SP.period(sim.p))} שנ׳ (${oldName} ← ${nameOf(sp)}).`, 5);
      G.sfx.whoosh();
    }));

    // ---- speech ----
    function say(text, secs = 2.6) { const el = $("#say"); el.textContent = text; el.hidden = false; sayT = secs; }
    const DRAG_LINES = ["תפסיק למשוך, אני לא גומייה!", "עוד קצת ואתה מודד לי את האישיות בניוטון.", "אוי, זה מותח."];
    const RELEASE_LINES = ["אני לא קופץ, אני מתנודד!", "וואו. שוב!", "למעלה, למטה, למעלה…"];

    // ---- geometry: metres to pixels, everything in one coordinate system ----
    const TOP = 22;
    const hookY = (s) => TOP + (L0 + s) * scale;
    function targetScale() {
      const ph = phys(sp), eq = SP.equilibrium(sim.p);
      return clamp((H - TOP - 30) / (L0 + eq + U_MAX + ph.height_m * 1.02), 60, 900);
    }
    // the top of the head sits right on the hook, and a heavier experiment mass makes a rounder body
    function creatureRect(s) {
      const fat = fatness(mass(), m0()), pr = probe(img) || { top: 0 };
      const h = phys(sp).height_m * scale * (1 + (fat - 1) * 0.12), w = (img.naturalWidth ? h * img.naturalWidth / img.naturalHeight : h) * fat;
      const cx = W * 0.58, y = hookY(s) - pr.top * h;
      return { x: cx - w / 2, y, w, h, cx, fat, top: pr.top };
    }

    // ---- dragging: hold the creature below equilibrium, let go to release ----
    function pointerPos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener("pointerdown", (e) => {
      if (isSheetOpen()) return;
      const p = pointerPos(e), r = creatureRect(sim.st.s), yS = hookY(sim.st.s), yEq = hookY(SP.equilibrium(sim.p));
      const onBody = !(p.x < r.x - 30 || p.x > r.x + r.w + 30 || p.y < yS - 10 || p.y > r.y + r.h + 30);
      if (!onBody) {
        const at = { x: e.clientX, y: e.clientY };
        if (Math.abs(p.x - r.cx) < 30 && p.y > TOP && p.y < yS - 6) openInfo("k", at);
        else if (Math.abs(p.y - yEq) < 14) openInfo("eq", at);
        else if (p.x < 70) openInfo("s", at);
        return;
      }
      G.audio.unlock();
      dragging = { dy: p.y - hookY(sim.st.s) };
      cv.setPointerCapture(e.pointerId);
      sim.hold(sim.u);
      trial = null;
      if (!everDragged) { everDragged = true; if (P.achieve("first_drag")) reward("ach:first_drag", 3, { x: e.clientX, y: e.clientY }); }
      say(DRAG_LINES[Math.floor(Math.random() * DRAG_LINES.length)], 2);
    });
    cv.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const p = pointerPos(e);
      const eqY = hookY(SP.equilibrium(sim.p));
      const u = clamp((p.y - dragging.dy - eqY) / scale, 0, U_MAX);
      sim.hold(u);
    });
    const letGo = () => {
      if (!dragging) return;
      dragging = null;
      const u0 = sim.u;
      if (u0 < 0.02) { sim.reset(sim.p, 0); return; }        // too small: it just settles
      lab.lastU0 = u0;
      sim.release();
      trial = startRelease(u0);
      G.sfx.boing(0.6); G.buzz(15);
      say(RELEASE_LINES[Math.floor(Math.random() * RELEASE_LINES.length)], 1.8);
    };
    cv.addEventListener("pointerup", letGo); cv.addEventListener("pointercancel", letGo);

    // ---- what counts as learning: watching real swings, and comparing ----
    function startRelease(u0) { return { k: lab.k, m: mass(), b: lab.b, u0, seen: false }; }
    const same = (a, b) => Math.abs(a - b) / Math.max(a, b) < 0.03;
    function observe() {
      if (!trial || trial.seen || sim.held) return;
      if (sim.periods() < 2 && sim.t < SP.period(sim.p) * 1.2) return;   // at least one full swing
      trial.seen = true; releases.push(trial); keeper.seen();
      const r = releases, c = trial;
      const got = [];
      if (c.u0 >= 0.03) got.push("springs.hooke");
      if ((formulaOpen || P.data.physics.formulaSeen) && c.u0 >= 0.10) got.push("springs.energy");
      if (r.some((x) => x !== c && same(x.m, c.m) && Math.max(x.k, c.k) / Math.min(x.k, c.k) >= 1.5)) got.push("springs.oscillation");
      if (r.some((x) => x !== c && same(x.k, c.k) && Math.max(x.m, c.m) / Math.min(x.m, c.m) >= 1.5)) got.push("springs.shm");
      const fresh = got.filter((id) => P.completeSubtopic(id));
      if (fresh.length) { celebrate(fresh); questionCooldown = 2; return; }
      if (!P.data.physics.formulaSeen && c.u0 >= 0.10 && done().includes("springs.hooke")) say("רוצה לראות כמה אנרגיה נאגרה? לחצו על 'הצג נוסחה'.", 3.5);
      else if (!done().includes("springs.oscillation") && releases.length >= 2) say("נסו קפיץ קשיח יותר ותראו מה קורה לקצב.", 3);
      else if (!done().includes("springs.shm") && done().includes("springs.oscillation")) say("ומה אם הדמות כבדה יותר? הזיזו את המסה או החליפו דמות.", 3.5);
      maybeAsk();
    }

    function celebrate(ids) {
      const r = creatureRect(sim.st.s), cr = cv.getBoundingClientRect();
      celebrateUnits("springs", ids, { x: cr.left + r.cx, y: cr.top + r.y + r.h / 2 });
    }
    const pool = () => QUESTIONS.filter((q) => !["springs.wall", "springs.launch", "springs.graph"].includes(q.unit) && (done().includes(q.unit) || q.unit === "springs.hooke"));
    function maybeAsk() {
      if (questionCooldown > 0) { questionCooldown--; return; }
      if (inviteQuestion(box, "springs", pool())) questionCooldown = 3;
    }

    // ---- drawing ----
    function pencilLine(x0, y0, x1, y1, w = 2, color = "#3a3a40") {
      ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.globalAlpha *= 0.35; ctx.lineWidth = w * 0.6; ctx.beginPath(); ctx.moveTo(x0 + 0.8, y0 + 0.6); ctx.lineTo(x1 + 0.8, y1 + 0.6); ctx.stroke(); ctx.globalAlpha /= 0.35;
    }
    function draw() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.direction = "ltr";                                 // numbers and units read left to right
      const p = sim.p, s = sim.st.s, eq = SP.equilibrium(p);
      const r = creatureRect(s), x = r.cx;
      // ceiling, hatched
      ctx.fillStyle = "#F4F4F2"; ctx.fillRect(x - 70, 0, 140, TOP);
      pencilLine(x - 74, TOP, x + 74, TOP, 2.4);
      ctx.save(); ctx.beginPath(); ctx.rect(x - 70, 0, 140, TOP); ctx.clip();
      ctx.strokeStyle = "rgba(58,58,64,0.35)"; ctx.lineWidth = 1.2;
      for (let i = -10; i < 160; i += 10) { ctx.beginPath(); ctx.moveTo(x - 70 + i, TOP); ctx.lineTo(x - 70 + i + 14, 0); ctx.stroke(); }
      ctx.restore();
      // ruler: s from the natural length, in metres
      const rx = 40, y0 = hookY(0), yEnd = hookY(eq + U_MAX + 0.02);
      pencilLine(rx, TOP, rx, yEnd, 1.6, "#6B6B70");
      ctx.font = "600 11px " + FONT; ctx.fillStyle = "#606671"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const stepM = scale > 400 ? 0.05 : scale > 180 ? 0.1 : 0.2;
      for (let m = 0; L0 + m <= (yEnd - TOP) / scale + 1e-6; m = +(m + stepM / 2).toFixed(4)) {
        const y = hookY(m), major = Math.abs((m / stepM) - Math.round(m / stepM)) < 1e-6;
        ctx.strokeStyle = "#6B6B70"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(rx, y); ctx.lineTo(rx + (major ? 12 : 6), y); ctx.stroke();
        if (major) ctx.fillText(fmt(m, stepM < 0.1 ? 2 : 1), rx - 6, y);
      }
      ctx.save(); ctx.translate(rx - 26, (TOP + y0) / 2 + 10); ctx.rotate(-Math.PI / 2); ctx.textAlign = "center"; ctx.fillText("s (m)", 0, 0); ctx.restore();
      // equilibrium line
      const yEq = hookY(eq);
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "rgba(138,96,232,0.75)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(rx, yEq); ctx.lineTo(W - 12, yEq); ctx.stroke(); ctx.restore();
      ctx.fillStyle = "#6E48C9"; ctx.font = "600 12px " + FONT;
      ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.fillText("שיווי משקל", W - 12, yEq - 10); ctx.direction = "ltr";
      // the spring: its look follows k, and it ends exactly at the hook
      const yS = hookY(s);
      drawSpring(ctx, x, TOP, x, yS - 7, lab.k, true);
      ctx.fillStyle = "#E2574C"; ctx.beginPath(); ctx.moveTo(rx + 2, yS); ctx.lineTo(rx + 12, yS - 6); ctx.lineTo(rx + 12, yS + 6); ctx.fill();
      ctx.font = "700 12px " + FONT;
      const tag = fmt(s, 2) + " m", tw = ctx.measureText(tag).width + 12;
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#E2574C"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(rx + 14, yS - 11, tw, 22, 6) : ctx.rect(rx + 14, yS - 11, tw, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#C2392F"; ctx.textAlign = "left"; ctx.fillText(tag, rx + 20, yS);
      // the creature, hanging from the hook (a little squash from the motion is visual only)
      if (img.complete && img.naturalWidth) {
        const a = SP.accel(s, sim.st.v, p);
        const sq = reduceMotion ? 1 : 1 + clamp(-a / 120, -0.06, 0.06);
        ctx.save(); ctx.translate(x, yS); ctx.scale(2 - sq, sq);
        ctx.drawImage(img, -r.w / 2, -r.top * r.h, r.w, r.h); ctx.restore();
      }

      ctx.strokeStyle = "#F49A35"; ctx.lineWidth = 2.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x, yS - 8); ctx.lineTo(x, yS - 2); ctx.arc(x + 4, yS - 2, 4, Math.PI, Math.PI * 1.9, true); ctx.stroke();
      ctx.fillStyle = "#F49A35"; ctx.beginPath(); ctx.ellipse(x, yS + 1, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      // the two forces on the creature: weight down, spring up (same scale, so they can be compared)
      {
        const Wt = p.m * p.g, Fs = p.k * s, kpx = 78 / Math.max(Wt, Fs * 0.6, 1), cy = r.y + r.h * 0.55, ox = r.w * 0.5 + 22;
        forceArrow(ctx, x + Math.min(ox, W - x - 70), cy, 0, Wt * kpx, "#2785C7", "mg", { value: Wt });
        if (Math.abs(Fs) > 0.05) forceArrow(ctx, x + Math.min(ox, W - x - 70), cy, 0, -Fs * kpx, "#25A06F", "kΔx", { value: Math.abs(Fs) });

        const ax = x - r.w / 2 - 18, ay = yS + r.h * 0.35 + k * 26;
        ctx.beginPath(); ctx.moveTo(ax, ay - 22); ctx.lineTo(ax, ay); ctx.moveTo(ax - 7, ay - 8); ctx.lineTo(ax, ay); ctx.lineTo(ax + 7, ay - 8); ctx.stroke();
        ctx.globalAlpha = 1; ctx.fillStyle = "#1A74D0"; ctx.font = "600 13px " + FONT;
        ctx.direction = "rtl"; ctx.textAlign = "center"; ctx.fillText("גררו למטה", ax, yS + r.h * 0.35 + 50); ctx.direction = "ltr";
      }
    }
    function paintReadouts() {
      const p = sim.p, s = sim.st.s;
      $("#rS").textContent = fmt(s * 100, 1) + " cm";
      const F = -p.k * s;
      $("#rF").textContent = fmt(Math.abs(F), 1) + " N " + (F < 0 ? "↑" : F > 0 ? "↓" : "");
      $("#rE").textContent = fmt(SP.elasticEnergy(s, p.k), 2) + " J";
      const Tm = sim.measuredPeriod();
      const rT = $("#rT");
      if (p.b > 0 && !SP.underdamped(p)) { rT.textContent = "אין תנודה"; rT.className = "dim"; }
      else if (Tm && !sim.held && p.b === 0) { rT.textContent = fmt(Tm) + " s"; rT.className = ""; rT.title = "נמדד מהתנועה; לפי הנוסחה " + fmt(SP.period(p)) + " s"; }
      else { rT.textContent = (p.b > 0 ? "≈" : "") + fmt(SP.period(p)) + " s"; rT.className = "dim"; }
    }
    let fpaint = 0;
    function frame(now) {
      const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      if (!isSheetOpen()) sim.advance(dt);
      const target = targetScale();
      scale += (target - scale) * Math.min(1, dt * 5);
      draw();
      if ((fpaint++ & 3) === 0) { paintReadouts(); if (formulaOpen) paintFormula(); }
      if (sayT > 0) { sayT -= dt; if (sayT <= 0) $("#say").hidden = true; }
      observe();
      keeper.tick(!dragging && (!trial || trial.seen));
      raf = requestAnimationFrame(frame);
    }
    scale = targetScale() || 300;
    raf = requestAnimationFrame(frame);
    say(nameOf(sp) + " תלוי על הקפיץ. גררו אותו למטה ושחררו.", 3.2);
    cleanup = () => { cancelAnimationFrame(raf); ro.disconnect(); closeInfo(); infoLive = () => ({}); document.querySelector(".sheet-back")?.remove(); };
    bindModeSeg(args);
  };

  // ======================================================================
  //  SPRING FROM THE WALL: the creature on a floor with friction
  // ======================================================================
  SCREENS.wall = (args = {}) => {
    lab.mode = "wall";
    setTitle("קפיץ־קפוץ", "קפיץ מהקיר, רצפה עם חיכוך");
    let sp = activeSpecies();
    const m0 = () => phys(sp).mass_kg, mass = () => lab.massOverride ?? m0();
    const mu = () => (phys(sp).surfaces || {})[lab.surface] || { mu_s: phys(sp).mu_s, mu_k: phys(sp).mu_k };
    const hp = () => SP.hparams(mass(), lab.k, mu().mu_s, mu().mu_k);
    screenEl.innerHTML = `
      <div class="lab-screen">
        ${modeSeg("wall")}
        <div class="lab" id="lab">
          <canvas id="labCanvas"></canvas>
          <div class="bubble say" id="say" hidden></div>
          <div class="lab-tools">

          <button type="button" class="readout" data-info="F"><small>כוח קפיץ <i class="qi">?</i></small><b id="rF">–</b></button>
