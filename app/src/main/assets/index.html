  // ======================================================================

      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
      const v = U * (0.3 + Math.random() * 0.5);
      fx.push({ kind: "chip", x: s.cx + (Math.random() - 0.5) * s.rx, y: s.cy - s.ry * 0.3 + (Math.random() - 0.5) * s.ry,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.9, r: U * (0.008 + Math.random() * 0.012),
        spin: (Math.random() - 0.5) * 12, rot: Math.random() * 6 });
    }
  }
  let screenShake = 0;
  function shakeScreen(a) { screenShake = Math.max(screenShake, a); }

  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const p = fx[i];
      p.t += dt;
      if (p.kind === "spark") { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 1.4 * dt; p.vx *= 0.97; }
      if (p.kind === "chip") { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 2.6 * dt; p.rot += p.spin * dt; }
      if (p.t >= p.life) fx.splice(i, 1);
    }
    screenShake = Math.max(0, screenShake - dt * 1.6);
  }
  function star(x, y, r, n) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * 0.45 : r;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function drawFx() {
    for (const p of fx) {
      const k = p.t / p.life;
      if (p.kind === "sprite") {
        const im = img[p.key]; if (!im || !im.complete || !im.naturalWidth) continue;
        const pop = k < 0.18 ? 0.4 + (k / 0.18) * 0.75 : k < 0.3 ? 1.15 - (k - 0.18) / 0.12 * 0.15 : 1;
        const a = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
        const s = p.size * pop / Math.max(p.w, p.h);
        ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot + k * 0.25);
        ctx.drawImage(im, -p.w * s / 2, -p.h * s / 2, p.w * s, p.h * s); ctx.restore();
      } else if (p.kind === "spark") {
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.fillStyle = p.col; ctx.strokeStyle = "#1c1c20"; ctx.lineWidth = 1.2;
        star(p.x, p.y, p.r * (1 + k * 0.5), 5); ctx.fill(); ctx.stroke(); ctx.restore();
      } else if (p.kind === "chip") {
        ctx.save(); ctx.globalAlpha = 1 - k * k; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = "#f4f2ee"; ctx.strokeStyle = "#2a2a2e"; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-p.r, -p.r * 0.5); ctx.lineTo(p.r * 0.8, -p.r); ctx.lineTo(p.r, p.r * 0.7); ctx.lineTo(-p.r * 0.4, p.r);
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
  }

  // ======================================================================
  //  UPDATE
  // ======================================================================
  let time = 0, dizzyClock = 0;
  function update(dt) {
    time += dt;
    const now = performance.now();
    const sensorLive = tilt.have && now - tilt.lastAt < 1500;

    let tx = 0, ty = 0;
    if (sensorLive) {
      const k = 1 - Math.exp(-dt / 14);          // a held grip slowly becomes "level"
      tilt.refx += (tilt.gx - tilt.refx) * k;
      tilt.refy += (tilt.gy - tilt.refy) * k;
      tx = tilt.gx - tilt.refx; ty = tilt.gy - tilt.refy;
    } else if (tilt.pointer) {
      tx = -((tilt.pointer.x - W / 2) / (W / 2)) * 0.6;
      ty = ((tilt.pointer.y - H / 2) / (H / 2)) * 0.6;
    }
    tx = clamp(tx, -0.8, 0.8); ty = clamp(ty, -0.8, 0.8);
    const sm = 1 - Math.exp(-dt / 0.08);
    tilt.dx += (tx - tilt.dx) * sm; tilt.dy += (ty - tilt.dy) * sm;

    // eye: tilting reads as moving your head around the window
    let ex = tilt.dx * U * 1.2, ey = -tilt.dy * U * 1.2;
    if (!sensorLive && !tilt.pointer && !reduceMotion) {
      ex += Math.sin(time * 0.37) * U * 0.12;
      ey += Math.sin(time * 0.23 + 1) * U * 0.07;
    }
    eye.x += (clamp(ex, -U * 0.7, U * 0.7) - eye.x) * sm;
    eye.y += (clamp(ey, -U * 0.7, U * 0.7) - eye.y) * sm;

    const slopeSide = -tilt.dx;
    const slopeFwd = tilt.dy;
    const slope = Math.hypot(slopeSide, slopeFwd);

    egg.hitT = Math.max(0, egg.hitT - dt);
    egg.shakeT = Math.max(0, egg.shakeT - dt);
    egg.shownShell += (egg.shell - egg.shownShell) * (1 - Math.exp(-dt / 0.25));
    updateFx(dt);

    if (egg.state === "arriving") {
      updateMagic(dt);
      egg.side = magic.wobble; egg.panic = 0;
      if (magic.t >= MAGIC.duration) { egg.state = "stand"; egg.side = 0; }
      return;
    }

    if (egg.state === "stand") {
      const want = clamp((slope - CALM) / (FALL - CALM), 0, 1.4);
      const prev = egg.panic;
      egg.panic += (want - egg.panic) * (1 - Math.exp(-dt / (want > egg.panic ? 0.15 : 0.5)));
      if (prev < 0.8 && egg.panic >= 0.8) sfx.whoa();
      if (egg.panic > 0.2) damage(DMG.panicPerSec * egg.panic * dt);

      // lean: springs toward the slope, sways harder when panicking
      const sway = egg.panic > 0.05 && !reduceMotion ? Math.sin(time * 9.5) * 0.08 * egg.panic : 0;
      const tgt = clamp(slopeSide * 0.5 + sway, -0.5, 0.5);
      egg.vSide += ((tgt - egg.side) * 60 - egg.vSide * 9) * dt;
      egg.side += egg.vSide * dt;

      if (slope > FALL) egg.overTime += dt; else egg.overTime = Math.max(0, egg.overTime - dt * 2);
      if (egg.overTime > FALL_HOLD) {
        egg.state = "falling"; egg.t = 0;
        egg.fallDir = Math.sign(slopeSide) || (Math.random() < 0.5 ? -1 : 1);
        egg.fromSide = egg.side;
      }
    } else if (egg.state === "falling") {
      egg.t = Math.min(1, egg.t + dt / 0.38);
      egg.side = lerp(egg.fromSide, egg.fallDir * 1.25, egg.t * egg.t);
      if (egg.t >= 1) {
        egg.state = "down"; egg.t = 0; egg.downTime = 0; egg.panic = 0;
        sfx.thud(); buzz(60); shakeScreen(0.6);
        damage(DMG.fall);
      }
    } else if (egg.state === "down") {
      egg.t += dt;
      dizzyClock -= dt;
      if (dizzyClock <= 0 && egg.t > 0.4) { sfx.dizzy(); dizzyClock = 0.9; }
      if (slope < CALM * 1.2) egg.downTime += dt; else egg.downTime = 0;
      if (egg.downTime > GET_UP_AFTER) { egg.state = "rising"; egg.t = 0; }
    } else if (egg.state === "rising") {
      egg.t = Math.min(1, egg.t + dt / 0.7);
      egg.hop = egg.t > 0.45 ? Math.sin((egg.t - 0.45) / 0.55 * Math.PI) : 0;
      if (egg.t >= 1) { egg.state = "stand"; egg.side = 0; egg.vSide = 0; egg.overTime = 0; egg.hop = 0; egg.hitT = 0; }
    }
  }

  // which drawing to show, and whether to mirror it so it leans the right way
  const LEANS = { scaredL: 1, scaredR: 1, nervous: 1, oh: -1, scream: -1 };
  function choosePose() {
    const dir = egg.state === "falling" ? egg.fallDir : (egg.side >= 0 ? 1 : -1);
    const m = (name) => ({ name, mirror: LEANS[name] ? LEANS[name] !== dir : false, rotK: LEANS[name] ? 0.35 : 1 });
    if (egg.state === "arriving") return { name: "crack1", mirror: false, rotK: 1 };
    if (egg.state === "falling") return m("scream");
    if (egg.state === "down") return { name: "lying", mirror: egg.fallDir < 0, rotK: 0 };
    if (egg.state === "rising") return egg.t < 0.45 ? { name: "lying", mirror: egg.fallDir < 0, rotK: 0 } : m("worry1");
    if (egg.hitT > 0) return { name: "wince", mirror: false, rotK: 1 };
    const p = egg.panic;
    if (egg.shakeT > 0) {
      const f = egg.shakeT > 0.45 ? ["flail3", "flail4"] : ["flail1", "flail2"];
      return { name: f[Math.floor(time * 11) % 2], mirror: false, rotK: 1 };
    }
    if (p > 0.8) return m(["scaredL", "scream", "scaredR", "oh"][Math.floor(time * 5.5) % 4]);
    if (p > 0.55) return m(["worry1", "worry2", "nervous"][Math.floor(time * 2.6) % 3]);
    if (p > 0.18) {
      const f = p > 0.38 ? ["flail3", "flail4"] : ["flail1", "flail2"];
      return { name: f[Math.floor(time * (p > 0.38 ? 10 : 6)) % 2], mirror: false, rotK: 1 };
    }
    return { name: "crack" + (egg.stage + 1), mirror: false, rotK: 1 };
  }

  // ======================================================================
  //  DRAW: ROOM AND NEST
  // ======================================================================
  function drawRoom() {
    const N = 40, rc = U * 0.06;
    for (let i = N; i >= 0; i--) {
      const t = i / N, z = -DEPTH * t;
      const [sx, sy, f] = proj(-W / 2, -H / 2, z);
      const v = Math.round(lerp(232, 168, Math.pow(t, 0.8)));
      ctx.fillStyle = `rgb(${v},${v},${v + 2})`;
      ctx.beginPath();
      ctx.rect(-10, -10, W + 20, H + 20);
      roundRectPath(ctx, sx, sy, W * f, H * f, rc * f);
      ctx.fill("evenodd");
    }
    const [bx, by, bf] = proj(-W / 2, -H / 2, -DEPTH);
    ctx.fillStyle = "rgb(198,198,200)";
    ctx.beginPath(); roundRectPath(ctx, bx, by, W * bf, H * bf, rc * bf); ctx.fill();
    ctx.strokeStyle = "rgba(30,30,34,0.35)";
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    for (const [cx, cy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const [x0, y0] = proj(cx * W / 2, cy * H / 2, 0);
      const [x1, y1] = proj(cx * W / 2, cy * H / 2, -DEPTH);
      sketchLine(x0, y0, x1, y1, cx * 31 + cy * 7);
    }
    ctx.beginPath(); roundRectPath(ctx, bx, by, W * bf, H * bf, rc * bf);
    ctx.strokeStyle = "rgba(30,30,34,0.3)"; ctx.stroke();
    ctx.strokeStyle = "rgba(30,30,34,0.12)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 7; i++) {
      const z = -DEPTH * (i / 7);
      const [x0, y0] = proj(-W / 2, H / 2, z);
      const [x1] = proj(W / 2, H / 2, z);
      sketchLine(x0, y0, x1, y0, i * 13);
    }
  }
  function sketchLine(x0, y0, x1, y1, seed) {
    for (let k = 0; k < 2; k++) {
      const j = (n) => Math.sin(seed * 12.9898 + n * 78.233 + k * 3.1) * 1.2;
      ctx.beginPath();
      ctx.moveTo(x0 + j(1), y0 + j(2));
      ctx.quadraticCurveTo((x0 + x1) / 2 + j(3) * 2, (y0 + y1) / 2 + j(4) * 2, x1 + j(5), y1 + j(6));
      ctx.stroke();
    }
  }

  function layout() {
    const zN = -DEPTH * 0.45;
    const f = scaleAt(zN);
    const nestW = Math.min(W * 1.05, U * 1.15) / f * 0.9;
    const nestH = nestW * img.nest.height / img.nest.width;
    const floorY = H / 2;
    const nestTop = floorY - nestH * 0.98;
    return { zN, nestW, nestH, nestTop, floorY };
  }

  function drawNest(L, front) {
    const [sx, sy, f] = proj(-L.nestW / 2, L.nestTop, L.zN);
    const w = L.nestW * f, h = L.nestH * f;
    if (!front) {
      const [cx, cy] = proj(0, L.floorY, L.zN);
      ctx.save();
      ctx.translate(cx, cy - h * 0.04); ctx.scale(1, 0.18);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.55);
      g.addColorStop(0, "rgba(20,20,24,0.35)"); g.addColorStop(1, "rgba(20,20,24,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, w * 0.55, 0, 6.2832); ctx.fill();
      ctx.restore();
      ctx.drawImage(img.nest, sx, sy, w, h);
      return;
    }
    // front rim: the same drawing, only below the bowl's lower lip
    ctx.save();
    ctx.beginPath();
    const cx = sx + w * NEST.lipCx, cy = sy + h * NEST.lipCy, rx = w * NEST.lipRx, ry = h * NEST.lipRy;
    ctx.moveTo(sx - 2, cy);
    ctx.lineTo(cx - rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(sx + w + 2, cy);
    ctx.lineTo(sx + w + 2, sy + h + 2);
    ctx.lineTo(sx - 2, sy + h + 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(img.nest, sx, sy, w, h);
    ctx.restore();
  }

  // ======================================================================
  //  DRAW: THE EGG
  // ======================================================================
  function eggAnchor(L) {
    const footWorldY = L.nestTop + L.nestH * NEST.bowlY;
    const zE = L.zN + L.nestW * 0.02;
    const [fx, fy, f] = proj(0, footWorldY, zE);
    return { fx, fy, f, eggH: L.nestW * 0.62 * f };
  }

  function drawEgg(L, alpha) {
    const A = eggAnchor(L);
    const pose = choosePose();
    const P = SPR.poses[pose.name];
    const im = img["p_" + pose.name];
    const ref = SPR.poses.crack1;
    let s = A.eggH / P.hgt;
    let x = A.fx, y = A.fy, rot = egg.side * pose.rotK, sy = 1;

    if (pose.name === "lying") {
      // match the shell size of the standing egg
      const shellH = (ref.bodyBot - ref.bodyTop) * (A.eggH / ref.hgt);
      s = shellH * 0.8 / P.shellLen;
      const k = egg.state === "down" ? Math.min(1, egg.t / 0.3) : 1;
      sy = egg.state === "down" ? 1 - Math.sin(k * Math.PI) * 0.12 : 1;     // squash on landing
      if (egg.state === "rising") rot = Math.sin(egg.t / 0.45 * Math.PI * 2) * 0.12 * (pose.mirror ? -1 : 1);
      y += A.eggH * 0.04;
    }
    if (egg.state === "falling") y += Math.sin(Math.abs(egg.side)) * A.eggH * 0.12;
    if (egg.hop) y -= egg.hop * A.eggH * 0.12;
    // breathing, a flinch when tapped, and a tremble when the shell is nearly gone
    sy *= 1 + Math.sin(time * 1.6) * 0.008;
    if (egg.hitT > 0) sy *= 1 - Math.sin(egg.hitT / 0.42 * Math.PI) * 0.06;
    if (egg.shell <= 0 && !reduceMotion && egg.state === "stand") { x += Math.sin(time * 41) * A.eggH * 0.006; rot += Math.sin(time * 33) * 0.02; }

    // the egg's screen area, for touches and shell chips
    if (pose.name === "lying") egg.screen = { cx: x, cy: y - A.eggH * 0.25, rx: A.eggH * 0.5, ry: A.eggH * 0.32 };
    else egg.screen = { cx: x - Math.sin(rot) * A.eggH * 0.45, cy: y - A.eggH * 0.52 * Math.cos(rot), rx: A.eggH * 0.36, ry: A.eggH * 0.5 };

    // shadow
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x - Math.sin(rot) * A.eggH * 0.15, A.fy);
    ctx.scale(1, 0.2);
    const sw = A.eggH * (pose.name === "lying" ? 0.7 : 0.42);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, sw);
    g.addColorStop(0, "rgba(20,20,24,0.38)"); g.addColorStop(1, "rgba(20,20,24,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, sw, 0, 6.2832); ctx.fill();
    ctx.restore();

    // violet light leaking out when it is ready to hatch
    if (egg.shell <= 0 && egg.state !== "arriving") {
      const cy = y - A.eggH * 0.5, r = A.eggH * (0.75 + Math.sin(time * 3) * 0.06);
      const gl = ctx.createRadialGradient(x, cy, 0, x, cy, r);
      gl.addColorStop(0, "rgba(196,181,253,0.75)"); gl.addColorStop(0.5, "rgba(139,92,246,0.3)"); gl.addColorStop(1, "rgba(139,92,246,0)");
      ctx.fillStyle = gl; ctx.fillRect(x - r, cy - r, r * 2, r * 2);
    }

    if (!im || !im.complete || !im.naturalWidth) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s * (pose.mirror ? -1 : 1), s * sy);
    ctx.drawImage(im, -P.ax, -P.ay, P.w, P.h);
    ctx.restore();

    // colorful stars circling its head while it lies there
    if (pose.name === "lying" && egg.state === "down") {
      const ring = starRings[0];
      const ri = ring && img[ring.name];
      if (ri && ri.complete && ri.naturalWidth) {
        const hx = x + (pose.mirror ? -1 : 1) * A.eggH * 0.1, hy = y - A.eggH * 0.72;
        const w = A.eggH * 0.6, h = w * ring.h / ring.w;
        ctx.save();
        ctx.globalAlpha = Math.min(1, egg.t / 0.4) * 0.95;
        ctx.translate(hx, hy);
        ctx.scale(1 + Math.sin(time * 4) * 0.05, 1);
        ctx.rotate(Math.sin(time * 2.2) * 0.12);
        ctx.drawImage(ri, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
    }
  }

  // ======================================================================
  //  THE SHELL BAR
  // ======================================================================
  function drawBar(alpha) {
    if (alpha <= 0.01) return;
    const e = img.bar_empty, f = img.bar_full;
    if (!e || !e.complete || !e.naturalWidth || !f || !f.complete || !f.naturalWidth) return;
    const B = SPR.bar;
    const barW = Math.min(W * 0.62, 330), s = barW / B.empty.w, barH = B.empty.h * s;
    const iconH = barH * 1.3;
    const total = barW + iconH;
    const x0 = (W - total) / 2 + iconH, y0 = Math.max(30, H * 0.06);
    const v = clamp(egg.shownShell, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(e, x0, y0, barW, barH);
    if (v > 0.001) {
      // the violet fill, cut at the current level
      const tubeL = x0 + barW * 0.012, tubeR = x0 + barW * 0.985;
      const cut = tubeL + (tubeR - tubeL) * v;
      ctx.save();
      ctx.beginPath(); ctx.rect(x0 - 30, y0 - barH, cut - x0 + 30, barH * 3); ctx.clip();
      const fs = barW / B.full.w * 1.02, fh = B.full.h * fs;
      ctx.drawImage(f, x0 - barW * 0.012, y0 + barH / 2 - fh / 2, B.full.w * fs, fh);
      ctx.restore();
      const g = ctx.createRadialGradient(cut, y0 + barH / 2, 0, cut, y0 + barH / 2, barH * 0.7);
      g.addColorStop(0, `rgba(237,228,255,${0.55 + Math.sin(time * 5) * 0.15})`); g.addColorStop(1, "rgba(167,139,250,0)");
      ctx.fillStyle = g; ctx.fillRect(cut - barH, y0 - barH * 0.2, barH * 2, barH * 1.4);
    }
    // the little egg at the left: happier while the shell is strong
    const n = v > 0.8 ? 5 : v > 0.6 ? 4 : v > 0.4 ? 3 : v > 0.2 ? 2 : 1;
    const ic = img["bar_icon" + n], ii = B["icon" + n];
    if (ic && ic.complete && ic.naturalWidth) {
      const ih = iconH, iw = ih * ii.w / ii.h;
      const bob = Math.sin(time * 2) * ih * 0.02;
      ctx.drawImage(ic, x0 - iw * 0.9, y0 + barH - ih + bob, iw, ih);
    }
    ctx.restore();
  }

  // ======================================================================
  //  ARRIVAL MAGIC
  // ======================================================================
  const magic = { t: 0, parts: [], sparks: [], wobble: 0, pulse: 0, glowCache: {}, pulsed: false };
  function glowSprite(col) {
    if (magic.glowCache[col]) return magic.glowCache[col];
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.18, col);
    gr.addColorStop(0.5, col + "55");
    gr.addColorStop(1, col + "00");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (magic.glowCache[col] = c);
  }
  function magicStrength(t) {
    const P = MAGIC.pulseAt, D = MAGIC.duration;
    if (t < P) return easeInOut(clamp((t - 0.2) / (P - 0.4), 0, 1));
    if (t < P + 0.35) return 1 + 0.6 * Math.sin((t - P) / 0.35 * Math.PI);
    return Math.max(0, 1 - easeInOut((t - P - 0.35) / (D - P - 0.35)));
  }
  function eggSolidity(t) {
    const P = MAGIC.pulseAt;
    if (t < 0.8) return 0;
    if (t < P) return Math.pow((t - 0.8) / (P - 0.8), 1.6) * 0.75 * (0.85 + 0.15 * Math.sin(t * 23));
    return Math.min(1, 0.75 + (t - P) / 0.25 * 0.25);
  }
  function newParticle(first) {
    return {
      th: Math.random() * Math.PI * 2,
      w: (1.6 + Math.random() * 2.4) * (Math.random() < 0.5 ? 1 : 1.15),
      h: first ? Math.random() : Math.random() * 0.15,
      rise: 0.14 + Math.random() * 0.22,
      rj: 0.75 + Math.random() * 0.5,
      size: 0.6 + Math.random() * 1.4,
      col: MAGIC.colors[Math.floor(Math.random() * MAGIC.colors.length)],
      trail: [], out: 0, bright: Math.random() < 0.08
    };
  }
  function updateMagic(dt) {
    magic.t += dt;
    const S = magicStrength(magic.t) * MAGIC.intensity;
    if (magic.t < MAGIC.pulseAt) sfx.magicRise(Math.min(1, S));
    const want = Math.round(MAGIC.count * Math.min(1, S));
    while (magic.parts.length < want) magic.parts.push(newParticle(magic.parts.length === 0));
    const sp = MAGIC.speed;
    for (let i = magic.parts.length - 1; i >= 0; i--) {
      const q = magic.parts[i];
      q.th += q.w * sp * dt * (1 + q.h * 0.6);
      q.h += q.rise * sp * dt;
      q.out += (magic.t > MAGIC.pulseAt ? 2.4 : 0) * dt;
      if (q.h > 1.15 || (q.h > 1 && magic.parts.length > want)) magic.parts.splice(i, 1);
    }
    if (Math.random() < S * 6 * dt) magic.sparks.push({ x: Math.random(), y: Math.random(), life: 0, size: 0.5 + Math.random() });
    for (let i = magic.sparks.length - 1; i >= 0; i--) {
      magic.sparks[i].life += dt / 0.6;
      if (magic.sparks[i].life >= 1) magic.sparks.splice(i, 1);
    }
    if (!magic.pulsed && magic.t >= MAGIC.pulseAt) { magic.pulsed = true; magic.pulse = 0.0001; sfx.magicPulse(); buzz(80); }
    if (magic.pulse > 0) magic.pulse += dt / 0.9;
    const settle = magic.t < MAGIC.pulseAt ? 1 : Math.max(0, 1 - (magic.t - MAGIC.pulseAt) / 1.2);
    magic.wobble = reduceMotion ? 0 : Math.sin(magic.t * 5.2) * 0.05 * settle * Math.min(1, magic.t / 1.5);
  }
  function magicFrame(L) {
    const A = eggAnchor(L);
    return { cx: A.fx, base: A.fy + A.eggH * 0.05, height: A.eggH * 1.45, R: A.eggH * 0.48 };
  }
  function particlePos(q, F) {
    const r = F.R * (0.45 + 0.75 * q.h) * q.rj * (1 + q.out * 0.6);
    const depth = Math.sin(q.th);
    return { x: F.cx + Math.cos(q.th) * r, y: F.base - q.h * F.height + depth * F.R * 0.12, depth };
  }
  function drawMagicParticles(L, behind) {
    if (egg.state !== "arriving") return;
    const F = magicFrame(L);
    const S = magicStrength(magic.t) * MAGIC.intensity;
    ctx.save();
    for (const q of magic.parts) {
      const p = particlePos(q, F);
      if ((p.depth < 0) !== behind) { q.trail.length = 0; continue; }
      q.trail.push(p); if (q.trail.length > 7) q.trail.shift();
      const fadeTop = q.h > 0.85 ? Math.max(0, 1 - (q.h - 0.85) / 0.3) : Math.min(1, q.h / 0.08);
      const a = clamp(S, 0, 1.3) * fadeTop * (behind ? 0.55 : 1);
      if (a <= 0.01) continue;
      if (q.trail.length > 2) {
        ctx.globalAlpha = a * 0.35;
        ctx.strokeStyle = q.col; ctx.lineWidth = q.size * 1.4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(q.trail[0].x, q.trail[0].y);
        for (let i = 1; i < q.trail.length; i++) ctx.lineTo(q.trail[i].x, q.trail[i].y);
        ctx.stroke();
      }
      const size = (q.bright ? 14 : 8) * q.size * (1 + p.depth * 0.25) * (U / 400);
      ctx.globalAlpha = a * (q.bright ? 1 : 0.85);
      ctx.drawImage(glowSprite(q.col), p.x - size, p.y - size, size * 2, size * 2);
    }
    ctx.restore();
  }
  function drawMagicFront(L) {
    if (egg.state !== "arriving") return;
    const F = magicFrame(L);
    const S = magicStrength(magic.t) * MAGIC.intensity;
    ctx.save();
    for (const s of magic.sparks) {
      const x = F.cx + (s.x - 0.5) * F.R * 2.6, y = F.base - s.y * F.height * 1.1;
      const life = Math.sin(s.life * Math.PI);
      const r = (5 + 9 * s.size) * life * (U / 400);
      ctx.globalAlpha = life * Math.min(1, S);
      ctx.strokeStyle = "#ede4ff"; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
      ctx.moveTo(x - r * 0.4, y - r * 0.4); ctx.lineTo(x + r * 0.4, y + r * 0.4);
      ctx.moveTo(x + r * 0.4, y - r * 0.4); ctx.lineTo(x - r * 0.4, y + r * 0.4);
      ctx.stroke();
      ctx.drawImage(glowSprite("#a78bfa"), x - r, y - r, r * 2, r * 2);
    }
    if (magic.pulse > 0 && magic.pulse < 1) {
      const t = magic.pulse, e = 1 - Math.pow(1 - t, 3);
      const cy = F.base - F.height * 0.38;
      ctx.globalAlpha = (1 - t) * 0.9;
      ctx.strokeStyle = "#a78bfa"; ctx.lineWidth = 3 * (1 - t) + 1;
      ctx.beginPath(); ctx.ellipse(F.cx, cy, F.R * (0.6 + e * 2.2), F.R * (0.6 + e * 2.2) * 0.9, 0, 0, Math.PI * 2); ctx.stroke();
      const g = ctx.createRadialGradient(F.cx, cy, 0, F.cx, cy, F.R * 2.4);
      g.addColorStop(0, `rgba(237,228,255,${0.75 * (1 - t)})`);
      g.addColorStop(0.4, `rgba(167,139,250,${0.35 * (1 - t)})`);
      g.addColorStop(1, "rgba(167,139,250,0)");
      ctx.globalAlpha = 1;
      ctx.fillStyle = g; ctx.fillRect(F.cx - F.R * 2.5, cy - F.R * 2.5, F.R * 5, F.R * 5);
    }
    ctx.restore();
  }

  // ======================================================================
  //  FRAME
  // ======================================================================
  let barAlpha = 0;
  function frame(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#ecebe8";
    ctx.fillRect(0, 0, W, H);
    if (screenShake > 0 && !reduceMotion) {
      const a = screenShake * U * 0.012;
      ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a);
    }
    drawRoom();
    const arriving = egg.state === "arriving";
    const S = arriving ? magicStrength(magic.t) * MAGIC.intensity : 0;
    if (S > 0) {
      ctx.fillStyle = `rgba(26,18,44,${0.32 * Math.min(1, S)})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (img.nest && img.nest.complete && img.nest.naturalWidth) {
      const L = layout();
      const solid = arriving ? eggSolidity(magic.t) : 1;
      drawNest(L, false);
      drawMagicParticles(L, true);
      if (solid > 0.01) drawEgg(L, solid);
      if (arriving && solid < 1) {
        const A = eggAnchor(L);
        const cy = A.fy - A.eggH * 0.5, r = A.eggH * 0.5;
        const g = ctx.createRadialGradient(A.fx, cy, 0, A.fx, cy, r);
        g.addColorStop(0, `rgba(196,181,253,${0.55 * Math.min(1, S) * (1 - solid * 0.6)})`);
        g.addColorStop(1, "rgba(139,92,246,0)");
        ctx.fillStyle = g; ctx.fillRect(A.fx - r, cy - r, r * 2, r * 2);
      }
      drawNest(L, true);
      ctx.drawImage(grainTex, 0, 0, W, H);
      drawMagicParticles(L, false);
      drawMagicFront(L);
    } else {
      ctx.drawImage(grainTex, 0, 0, W, H);
    }
    const v = ctx.createRadialGradient(W / 2, H * 0.45, U * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(20,20,24,0.22)");
    ctx.fillStyle = v; ctx.fillRect(-20, -20, W + 40, H + 40);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    barAlpha += ((arriving ? 0 : 1) - barAlpha) * (1 - Math.exp(-dt / 0.5));
    drawBar(barAlpha);
    drawFx();
  }

  // ======================================================================
  //  LOOP
  // ======================================================================
  let arrivedBefore = null;
  try { arrivedBefore = localStorage.getItem("egg.arrived"); } catch (e) {}
  if (MAGIC.enabled && (DEV.replayMagic || !arrivedBefore)) {
    egg.state = "arriving";
    try { localStorage.setItem("egg.arrived", "1"); } catch (e) {}
  }
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    // hold the arrival until the drawings are in, so the magic is not missed
    if (pending === 0 || egg.state !== "arriving") update(dt);
    frame(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
